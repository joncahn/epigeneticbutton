<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPICC Builder</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔘</text></svg>">
<link href="https://unpkg.com/tabulator-tables@6/dist/css/tabulator_midnight.min.css" rel="stylesheet">
<script src="https://unpkg.com/tabulator-tables@6/dist/js/tabulator.min.js"></script>
<script src="https://unpkg.com/js-yaml@4/dist/js-yaml.min.js"></script>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #e94560;
    --accent2: #53a8b6;
    --text: #eee;
    --text-dim: #999;
    --err: #e94560;
    --warn: #f0a500;
    --ok: #53a8b6;
    --border: #2a2a4a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  /* Top navigation bar */
  .topnav {
    display: flex;
    align-items: center;
    gap: 0;
    padding: 0 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    height: 44px;
  }
  .topnav .brand {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    cursor: pointer;
    padding: 0 16px 0 0;
    line-height: 44px;
    user-select: none;
  }
  .topnav .nav-tabs {
    display: flex;
    gap: 0;
    height: 100%;
  }
  .topnav .nav-tab {
    padding: 0 18px;
    line-height: 44px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-dim);
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    user-select: none;
    white-space: nowrap;
  }
  .topnav .nav-tab:hover { color: var(--text); }
  .topnav .nav-tab.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }
  .topnav .nav-links {
    margin-left: auto;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .topnav .nav-links a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    transition: color 0.15s;
  }
  .topnav .nav-links a:hover { color: var(--accent); }

  /* Section visibility */
  .section { display: none; flex-direction: column; flex: 1; overflow: hidden; }
  .section.active { display: flex; }

  /* Factor management panel */
  .factor-panel {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    padding: 8px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    min-height: 40px;
  }
  .factor-panel .factor-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .factor-tile {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-right: 2px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 3px 8px 3px 12px;
    font-size: 13px;
    color: var(--text);
  }
  .factor-tile .factor-remove {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 0 2px;
    border-radius: 50%;
    transition: color 0.15s, background 0.15s;
  }
  .factor-tile .factor-remove:hover {
    color: var(--accent);
    background: rgba(233,69,96,0.15);
  }
  .factor-panel input[type="text"] {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 13px;
    width: 140px;
  }
  .factor-panel input[type="text"]::placeholder { color: var(--text-dim); }
  .factor-help { color: var(--text-dim); font-size: 12px; }
  .factor-panel button {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.15s;
  }
  .factor-panel button:hover { background: var(--accent); }

  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    padding: 8px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .toolbar button, .toolbar label {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .toolbar button:hover, .toolbar label:hover { background: var(--accent); }
  .toolbar button:disabled { opacity: 0.35; cursor: default; pointer-events: none; }
  .toolbar .io-group { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .toolbar .btn-accent { background: var(--accent); color: #fff; }
  .toolbar .btn-accent:hover { background: #c73a52; }
  .toolbar input[type="file"] { display: none; }
  main {
    display: flex;
    flex-direction: column;
    flex: 1;
    overflow: hidden;
  }
  /* Genomes section */
  #genomes-section {
    overflow-y: auto;
    padding: 0;
  }
  #genomes-section .genomes-content {
    max-width: 800px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }
  .genome-panel {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    padding: 0 0 16px;
    min-height: 40px;
  }
  .genome-panel .genome-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .genome-tile {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-right: 2px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 3px 8px 3px 12px;
    font-size: 13px;
    color: var(--text);
  }
  .genome-tile .genome-remove {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 0 2px;
    border-radius: 50%;
    transition: color 0.15s, background 0.15s;
  }
  .genome-tile .genome-remove:hover {
    color: var(--accent);
    background: rgba(233,69,96,0.15);
  }
  .genome-panel input[type="text"] {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 13px;
    width: 140px;
  }
  .genome-panel input[type="text"]::placeholder { color: var(--text-dim); }
  .genome-panel button {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.15s;
  }
  .genome-panel button:hover { background: var(--accent); }
  .genome-help { color: var(--text-dim); font-size: 12px; }
  /* Config section */
  #config-section {
    overflow-y: auto;
    padding: 0;
  }
  #config-section .config-content {
    max-width: 800px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }
  .cfg-section { margin-bottom: 24px; }
  .cfg-section h2 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 12px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--accent);
    color: var(--text);
  }
  .cfg-section h3 {
    font-size: 14px;
    font-weight: 600;
    margin: 12px 0 8px;
    color: var(--accent2);
  }
  .cfg-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .cfg-row label {
    min-width: 200px;
    font-size: 13px;
    color: var(--text);
    flex-shrink: 0;
  }
  .cfg-row input[type="text"], .cfg-row input[type="number"], .cfg-row select {
    flex: 1;
    min-width: 200px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 13px;
  }
  .cfg-row input::placeholder { color: var(--text-dim); }
  .cfg-row .cfg-help {
    font-size: 12px;
    color: var(--text-dim);
    flex-basis: 100%;
  }
  /* Toggle switch */
  .cfg-toggle-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .cfg-toggle-row label {
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
  }
  .toggle-switch {
    position: relative;
    width: 40px;
    height: 22px;
    flex-shrink: 0;
  }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--surface2);
    border-radius: 11px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .toggle-slider::before {
    content: "";
    position: absolute;
    width: 16px;
    height: 16px;
    left: 3px;
    bottom: 3px;
    background: var(--text-dim);
    border-radius: 50%;
    transition: transform 0.2s, background 0.2s;
  }
  .toggle-switch input:checked + .toggle-slider {
    background: var(--accent);
  }
  .toggle-switch input:checked + .toggle-slider::before {
    transform: translateX(18px);
    background: white;
  }
  .cfg-msg {
    font-size: 13px;
    color: var(--text-dim);
    flex-basis: 100%;
    margin-top: -4px;
  }
  /* Collapsible details */
  .cfg-details {
    margin-bottom: 16px;
  }
  .cfg-details summary {
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    color: var(--accent2);
    padding: 8px 0;
    user-select: none;
  }
  .cfg-details summary:hover { color: var(--accent); }
  .cfg-details[open] summary { margin-bottom: 8px; }
  .cfg-details .cfg-details-body {
    padding-left: 16px;
    border-left: 2px solid var(--border);
  }
  /* Genome/species dynamic sections */
  .cfg-genome-group {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 16px;
    margin-bottom: 12px;
  }
  .cfg-genome-group h3 {
    margin-top: 0;
    font-size: 14px;
  }
  .cfg-footer {
    text-align: center;
    font-style: italic;
    color: var(--text-dim);
    font-size: 13px;
    padding: 20px 0;
    border-top: 1px solid var(--border);
    margin-top: 24px;
  }
  #description-panel {
    padding: 8px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-dim);
    min-height: 32px;
    flex-shrink: 0;
  }
  #description-panel strong { color: var(--accent2); margin-right: 6px; }
  #table-container {
    flex: 1;
    overflow: auto;
    padding: 0;
  }
  #diagnostics-panel {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 8px 20px;
    max-height: 180px;
    overflow-y: auto;
    flex-shrink: 0;
    font-size: 12px;
    font-family: "SF Mono", "Fira Code", "Consolas", monospace;
  }
  #diagnostics-panel:empty::before {
    content: "No validation issues";
    color: var(--ok);
  }
  .diag-error { color: var(--err); }
  .diag-warning { color: var(--warn); }
  .diag-ok { color: var(--ok); }
  .diag-summary { margin-bottom: 4px; font-weight: 600; }

  /* Tabulator overrides */
  .tabulator {
    background: var(--bg);
    border: none;
    font-size: 13px;
  }
  .tabulator .tabulator-header {
    background: var(--surface);
    border-bottom: 2px solid var(--accent);
  }
  .tabulator .tabulator-header .tabulator-col {
    background: var(--surface);
    border-right: 1px solid var(--border);
  }
  .tabulator .tabulator-header .tabulator-col .tabulator-col-title {
    color: var(--text);
    font-weight: 600;
  }
  .tabulator .tabulator-tableholder .tabulator-table .tabulator-row {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .tabulator .tabulator-tableholder .tabulator-table .tabulator-row:hover {
    background: var(--surface);
  }
  .tabulator .tabulator-row .tabulator-cell {
    border: none !important;
    border-right: 1px solid var(--border) !important;
    color: var(--text);
    padding: 4px 8px;
  }
  .tabulator .tabulator-row .tabulator-cell.tabulator-editing {
    border: 1px solid var(--accent2) !important;
    padding: 0;
  }
  .tabulator .tabulator-row .tabulator-cell.tabulator-editing input,
  .tabulator .tabulator-row .tabulator-cell.tabulator-editing select {
    background: var(--surface);
    color: var(--text);
    border: none;
    padding: 4px 8px;
    font-size: 13px;
  }
  .tabulator .tabulator-footer { background: var(--surface); }

  /* Validation indicators */
  .cell-error {
    border-left: 3px solid var(--err) !important;
  }
  .cell-warning {
    border-left: 3px solid var(--warn) !important;
  }

  /* Selected row highlight */
  .tabulator-row.tabulator-selected { background: var(--surface2) !important; }
  .tabulator-row.tabulator-selected:hover { background: #1a4a70 !important; }

  /* Placeholder styling for suggested Sample_ID */
  .cell-suggestion {
    color: var(--text-dim) !important;
    font-style: italic;
  }

  /* Example cell — dimmed until user edits it */
  .tabulator-row .tabulator-cell.cell-example {
    color: var(--text-dim) !important;
    font-style: italic;
  }

  /* Action column */
  .row-action-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 18px;
    padding: 0 4px;
    line-height: 1;
  }
  .row-action-btn:hover { color: var(--accent); }

  /* Context menu */
  .ctx-menu {
    position: fixed;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    z-index: 10000;
    min-width: 180px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    padding: 4px 0;
  }
  .ctx-menu div {
    padding: 8px 16px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
  }
  .ctx-menu div:hover {
    background: var(--surface2);
    color: var(--accent);
  }
  .ctx-menu-sep {
    border-top: 1px solid var(--border);
    margin: 4px 0;
    padding: 0 !important;
    cursor: default !important;
  }
  .ctx-menu-sep:hover {
    background: transparent !important;
    color: inherit !important;
  }

  /* Tabulator list editor dropdown styling */
  .tabulator-edit-list {
    background: var(--surface) !important;
    border: 1px solid var(--border) !important;
    color: var(--text) !important;
  }
  .tabulator-edit-list .tabulator-edit-list-item {
    color: var(--text) !important;
  }
  .tabulator-edit-list .tabulator-edit-list-item:hover {
    background: var(--surface2) !important;
    color: var(--accent) !important;
  }
  .tabulator-edit-list .tabulator-edit-list-item.active {
    background: var(--accent) !important;
    color: white !important;
  }
</style>
</head>
<body>

<nav class="topnav" role="navigation" aria-label="Main navigation">
  <span class="brand" onclick="switchSection('genomes-section')" title="EPICC Builder">EPICC</span>
  <div class="nav-tabs">
    <span class="nav-tab active" data-section="genomes-section" onclick="switchSection('genomes-section')">Reference Genomes</span>
    <span class="nav-tab" data-section="samplesheet-section" onclick="switchSection('samplesheet-section')">Samples</span>
    <span class="nav-tab" data-section="config-section" onclick="switchSection('config-section')">Options</span>
  </div>
  <div class="nav-links">
    <a href="https://epicc-documentation.readthedocs.io/" target="_blank" rel="noopener">Docs</a>
    <a href="https://github.com/joncahn/epigeneticbutton" target="_blank" rel="noopener">GitHub</a>
  </div>
</nav>

<main>
  <div id="genomes-section" class="section active">
    <div class="genomes-content" id="genomes-content"></div>
  </div>

  <div id="samplesheet-section" class="section">
    <div class="toolbar" id="ss-toolbar">
      <button id="btn-add-row" aria-label="Add a new empty row">+ Add Row</button>
      <button id="btn-dup-selected" aria-label="Duplicate selected rows" disabled>Duplicate Selected</button>
      <button id="btn-del-selected" aria-label="Delete selected rows" disabled>Delete Selected</button>
      <div class="io-group">
        <label for="import-file" class="btn-accent" role="button" aria-label="Import TSV file" tabindex="0"
               onkeydown="if(event.key==='Enter')this.click()">Import TSV
          <input type="file" id="import-file" accept=".tsv,.txt,.tab" aria-label="Choose TSV file to import">
        </label>
        <button id="btn-export" class="btn-accent" aria-label="Export sample sheet as TSV">Export TSV</button>
      </div>
    </div>
    <div class="factor-panel" id="factor-panel" role="group" aria-label="Factor management">
      <span class="factor-label">Factors:</span>
      <span id="factor-tiles"></span>
      <input type="text" id="factor-input" placeholder="e.g. genotype" aria-label="New factor name"
             onkeydown="if(event.key==='Enter'){addFactorFromInput(); event.preventDefault();}">
      <button onclick="addFactorFromInput()" aria-label="Add factor">+ Add</button>
      <span class="factor-help">Experimental variables for grouping samples in comparative analysis. All rows must have the same factors, and may have different levels (values).</span>
    </div>
    <div id="description-panel" aria-live="polite" role="status">
      Click a column header or cell to see its description.
    </div>
    <div id="table-container"></div>
    <div id="diagnostics-panel" aria-live="polite" role="log" aria-label="Validation diagnostics"></div>
  </div>

  <div id="config-section" class="section">
    <div class="toolbar" id="cfg-toolbar">
      <div class="io-group">
        <label for="import-yaml" class="btn-accent" role="button" aria-label="Import YAML config" tabindex="0"
               onkeydown="if(event.key==='Enter')this.click()">Import YAML
          <input type="file" id="import-yaml" accept=".yaml,.yml" aria-label="Choose YAML file to import">
        </label>
        <button id="btn-export-yaml" class="btn-accent" aria-label="Export config as YAML">Export YAML</button>
      </div>
    </div>
    <div class="config-content" id="config-content"></div>
  </div>
</main>

<script>
// ===========================================================================
// Constants (mirroring workflow/scripts/sample_sheet.py & samplefile_validation.py)
// ===========================================================================

const COLUMNS = [
  "Sample_ID", "Assay", "Genome", "Levels", "Replicate_ID",
  "Read_files", "Read_layout", "IP_target", "Control"
];

const VALID_ASSAYS = [
  "ChIP_broad", "ChIP_narrow", "ATAC",
  "RNAseq", "RAMPAGE",
  "sRNA",
  "WGBS", "EMseq", "dmC"
];

const ASSAY_TO_ENV = {
  ChIP_broad: "ChIP", ChIP_narrow: "ChIP",
  ATAC: "ATAC",
  RNAseq: "RNA", RAMPAGE: "RNA",
  sRNA: "sRNA",
  WGBS: "mC", EMseq: "mC", dmC: "mC"
};

const VALID_ASSAYS_SET = new Set(VALID_ASSAYS);
const CHIP_ASSAYS = new Set(["ChIP_broad", "ChIP_narrow"]);
const CONTROL_ASSAYS = new Set(["ChIP_broad", "ChIP_narrow", "RAMPAGE"]);

// Which assays can provide a control for each control-bearing assay
const CONTROL_SOURCE_ASSAYS = {
  ChIP_broad:  CHIP_ASSAYS,
  ChIP_narrow: CHIP_ASSAYS,
  RAMPAGE:     new Set(["RNAseq"]),
};

// Known marks and recommended assay type (derived from config/epicc-options.yaml peaktype)
const KNOWN_MARKS = [
  { pattern: /^(H3K27me[123]|H3K9me[123]|H4K20me[123]|H3K36me3|H3\.3|H3\.1|MGH3|CenH3|.*DDM1|PolIIS2P|H2AT120Ph|H2AKub)$/i, assay: "ChIP_broad" },
  { pattern: /^(H3K27ac|H3K4me3|H3K9ac|H4K16ac|H3K23ac|MNase)$/i, assay: "ChIP_narrow" },
  { pattern: /^(H3|H4)$/i, assay: "ChIP_broad" },
];

function getRecommendedAssay(ipTarget) {
  for (var i = 0; i < KNOWN_MARKS.length; i++) {
    if (KNOWN_MARKS[i].pattern.test(ipTarget)) return KNOWN_MARKS[i].assay;
  }
  return null;
}

const UNSAFE_CHARS_RE = /[/\\\s'";&|<>$`!{}()\[\]?*~#]/;
const DOUBLE_UNDERSCORE_RE = /__/;
const SRA_REGEX = /^[SDE]RR\d+$/;

// Factor column field prefix — internal only, never serialized
const FACTOR_PREFIX = "_factor_";
function factorField(name) { return FACTOR_PREFIX + name; }
function isFactorField(f) { return f.indexOf(FACTOR_PREFIX) === 0; }

const COLUMN_DESCRIPTIONS = {
  Sample_ID: "Unique identifier for each sample row. Used as a filesystem path component. Must not contain '__' or unsafe characters (/ \\ whitespace '\";&|<>$`!{}()[]?*~#). Concise descriptive IDs like 'WT_leaf_H3K9me2_rep1' are recommended.",
  Assay: "Experimental assay type. Determines pipeline routing: ChIP_broad (histone marks), ChIP_narrow (TFs, H3K4me3), ATAC, RNAseq, RAMPAGE, sRNA, WGBS, EMseq, dmC.",
  Genome: "Reference genome name (e.g. Spombe, ColCEN, hg38). Used to locate genome files under genomes/{Genome}/.",
  Levels: "Comma-separated factor:level pairs (e.g. genotype:WT,tissue:root). All rows must have the same factors. Level values form the 'levels_label' in analysis names.",
  Replicate_ID: "Replicate identifier (e.g. rep1, rep2). Replicates are mapped independently then merged for downstream analysis.",
  Read_files: "SRA accession (SRR12345678), local path, or '+'-separated for merging. PE local: comma-separated R1,R2 pair.",
  Read_layout: "Sequencing layout: SE (single-end) or PE (paired-end).",
  IP_target: "What was immunoprecipitated. Required for ChIP assays (e.g. H3K9me2, Input). Must be blank for non-ChIP assays.",
  Control: "Sample_ID of the control sample (e.g. Input for ChIP). Only for ChIP_broad, ChIP_narrow, RAMPAGE. No chaining allowed."
};

// Assay short names for Sample_ID suggestion (non-ChIP assays)
const ASSAY_SHORT = {
  ATAC: "ATAC", RNAseq: "RNA", RAMPAGE: "RAMPAGE",
  sRNA: "sRNA", WGBS: "WGBS", EMseq: "EMseq", dmC: "dmC"
};

// ===========================================================================
// State
// ===========================================================================

let table;
let cellIssues = {}; // { "rowId:field": { errors: [], warnings: [] } }
let activeCtxMenu = null;

// Factor state — array of factor name strings (e.g. ["genotype", "tissue"])
var factors = [];

// ===========================================================================
// Helpers
// ===========================================================================

function parseLevels(str) {
  if (!str) return null;
  const pairs = str.split(",").map(s => s.trim());
  const result = [];
  for (const p of pairs) {
    if (!p.includes(":")) return null;
    const [factor, ...rest] = p.split(":");
    result.push({ factor: factor.trim(), level: rest.join(":").trim() });
  }
  return result;
}

function levelsToLabel(str) {
  const parsed = parseLevels(str);
  if (!parsed) return "";
  return parsed.map(p => p.level).join("_");
}

// Build Levels string from _factor_* fields on a row
function buildLevelsFromFactors(rowData) {
  if (factors.length === 0) return "";
  var parts = [];
  for (var i = 0; i < factors.length; i++) {
    var val = (rowData[factorField(factors[i])] || "").trim();
    parts.push(factors[i] + ":" + val);
  }
  return parts.join(",");
}

// Inverse: populate _factor_* fields from a Levels string
function populateFactorsFromLevels(rowData) {
  var parsed = parseLevels(rowData.Levels || "");
  if (!parsed) return;
  for (var i = 0; i < parsed.length; i++) {
    rowData[factorField(parsed[i].factor)] = parsed[i].level;
  }
}

function suggestSampleId(rowData) {
  const assay = (rowData.Assay || "").trim();
  const rep = (rowData.Replicate_ID || "").trim();
  const ip = (rowData.IP_target || "").trim();
  var levels = factors.length > 0 ? buildLevelsFromFactors(rowData) : (rowData.Levels || "").trim();
  if (!levels) return "";
  var label = levelsToLabel(levels);
  if (!label || !rep) return "";
  if (CHIP_ASSAYS.has(assay)) {
    if (!ip) return "";
    return label + "_" + ip + "_" + rep;
  }
  const short = ASSAY_SHORT[assay];
  if (!short) return "";
  return label + "_" + short + "_" + rep;
}

function emptyRow() {
  var row = {
    Sample_ID: "", Assay: "", Genome: "", Replicate_ID: "",
    Read_files: "", Read_layout: "", IP_target: "", Control: "",
    _sid_user_edited: false
  };
  for (var i = 0; i < factors.length; i++) {
    row[factorField(factors[i])] = "";
  }
  return row;
}

// ===========================================================================
// Factor Management
// ===========================================================================

function getVisibleFields() {
  if (factors.length > 0) {
    var fields = ["Sample_ID", "Assay", "Genome"];
    for (var i = 0; i < factors.length; i++) {
      fields.push(factorField(factors[i]));
    }
    fields.push("Replicate_ID", "Read_files", "Read_layout", "IP_target", "Control");
    return fields;
  }
  return COLUMNS.slice();
}

function addFactorFromInput() {
  var input = document.getElementById("factor-input");
  var name = (input.value || "").trim().replace(/\s+/g, "_");
  input.value = "";
  if (name) addFactor(name);
  input.focus();
}

function addFactor(name) {
  name = name.trim().replace(/\s+/g, "_");
  if (!name) return;
  // No duplicates
  for (var i = 0; i < factors.length; i++) {
    if (factors[i].toLowerCase() === name.toLowerCase()) return;
  }
  // Forbidden chars in factor names: : , __
  if (name.includes(":") || name.includes(",") || name.includes("__")) {
    alert("Factor name cannot contain ':', ',' or '__'.");
    return;
  }
  factors.push(name);
  // Initialize factor field in all existing rows
  var allData = table.getData();
  for (var i = 0; i < allData.length; i++) {
    if (!allData[i][factorField(name)]) {
      allData[i][factorField(name)] = "";
    }
  }
  rebuildTableColumns();
  renderFactorTiles();
  refreshUI();
}

function removeFactor(name) {
  factors = factors.filter(function(f) { return f !== name; });
  rebuildTableColumns();
  renderFactorTiles();
  refreshUI();
}

function renderFactorTiles() {
  var container = document.getElementById("factor-tiles");
  while (container.firstChild) container.removeChild(container.firstChild);
  for (var i = 0; i < factors.length; i++) {
    var tile = document.createElement("span");
    tile.className = "factor-tile";
    var nameSpan = document.createElement("span");
    nameSpan.textContent = factors[i];
    tile.appendChild(nameSpan);
    var btn = document.createElement("button");
    btn.className = "factor-remove";
    btn.textContent = "\u00d7";
    btn.title = "Remove factor '" + factors[i] + "'";
    btn.setAttribute("aria-label", "Remove factor " + factors[i]);
    (function(fname) {
      btn.addEventListener("click", function() { removeFactor(fname); });
    })(factors[i]);
    tile.appendChild(btn);
    container.appendChild(tile);
  }
}

// ===========================================================================
// Genome Management (Reference Genomes tab)
// ===========================================================================

var definedGenomes = [];

function getDefinedGenomes() {
  // Union of manually added genomes + genomes found in sample sheet
  var seen = {};
  var result = [];
  for (var i = 0; i < definedGenomes.length; i++) {
    if (!seen[definedGenomes[i]]) {
      seen[definedGenomes[i]] = true;
      result.push(definedGenomes[i]);
    }
  }
  if (typeof table !== "undefined") {
    var data = table.getData();
    for (var i = 0; i < data.length; i++) {
      var g = (data[i].Genome || "").trim();
      if (g && !seen[g]) {
        seen[g] = true;
        result.push(g);
      }
    }
  }
  return result;
}

function addGenomeFromInput() {
  var input = document.getElementById("genome-input");
  var name = (input.value || "").trim();
  if (!name) return;
  if (definedGenomes.indexOf(name) >= 0) {
    input.value = "";
    return;
  }
  definedGenomes.push(name);
  input.value = "";
  buildGenomesTab();
}

function removeDefinedGenome(name) {
  definedGenomes = definedGenomes.filter(function(g) { return g !== name; });
  // Also remove configState entry
  if (configState.genomes && configState.genomes[name]) {
    delete configState.genomes[name];
  }
  buildGenomesTab();
}

function renderGenomeTiles(container) {
  var tilesSpan = container.querySelector("#genome-tiles");
  while (tilesSpan.firstChild) tilesSpan.removeChild(tilesSpan.firstChild);
  var allGenomes = getDefinedGenomes();
  for (var i = 0; i < allGenomes.length; i++) {
    var tile = document.createElement("span");
    tile.className = "genome-tile";
    var nameSpan = document.createElement("span");
    nameSpan.textContent = allGenomes[i];
    tile.appendChild(nameSpan);
    var btn = document.createElement("button");
    btn.className = "genome-remove";
    btn.textContent = "\u00d7";
    btn.title = "Remove genome '" + allGenomes[i] + "'";
    btn.setAttribute("aria-label", "Remove genome " + allGenomes[i]);
    (function(gname) {
      btn.addEventListener("click", function() { removeDefinedGenome(gname); });
    })(allGenomes[i]);
    tile.appendChild(btn);
    tilesSpan.appendChild(tile);
  }
}

function buildGenomesTab() {
  var container = document.getElementById("genomes-content");
  while (container.firstChild) container.removeChild(container.firstChild);

  // Genome name management panel
  var panel = el("div", { className: "genome-panel", id: "genome-panel" });
  panel.setAttribute("role", "group");
  panel.setAttribute("aria-label", "Reference genome management");
  panel.appendChild(el("span", { className: "genome-label", textContent: "Genomes:" }));
  panel.appendChild(el("span", { id: "genome-tiles" }));
  var inp = el("input", { type: "text", id: "genome-input", placeholder: "e.g. Spombe" });
  inp.setAttribute("aria-label", "New genome name");
  inp.addEventListener("keydown", function(e) {
    if (e.key === "Enter") { addGenomeFromInput(); e.preventDefault(); }
  });
  panel.appendChild(inp);
  var addBtn = el("button", { textContent: "+ Add" });
  addBtn.setAttribute("aria-label", "Add genome");
  addBtn.addEventListener("click", addGenomeFromInput);
  panel.appendChild(addBtn);
  panel.appendChild(el("span", { className: "genome-help",
    textContent: "Reference genomes used across samples. Configure paths and species parameters for each genome below." }));
  container.appendChild(panel);

  renderGenomeTiles(container);

  // Per-genome config sections
  var allGenomes = getDefinedGenomes();
  if (allGenomes.length === 0) {
    container.appendChild(el("p", { className: "cfg-help",
      textContent: "No genomes defined yet. Add a genome above or add samples in the Samples tab." }));
  } else {
    for (var i = 0; i < allGenomes.length; i++) {
      container.appendChild(buildGenomeSection(allGenomes[i]));
    }
  }
}

function rebuildTableColumns() {
  table.setColumns(buildColumnDefs());
  EDIT_FIELDS = getVisibleFields();
}

function buildColumnDefs() {
  var defs = [
    {
      formatter: "rowSelection", titleFormatter: "rowSelection",
      headerSort: false, width: 30, hozAlign: "center", resizable: false,
      cellClick: function(e, cell) { cell.getRow().toggleSelect(); },
    },
    {
      title: "", field: "_actions", width: 36, headerSort: false,
      cssClass: "action-col", hozAlign: "center", resizable: false,
      formatter: function() {
        return '<button class="row-action-btn" aria-label="Row actions" title="Row actions">\u22EE</button>';
      },
      cellClick: function(e, cell) {
        showCtxMenu(e, cell.getRow());
      }
    },
    Object.assign({
      title: "Sample ID", field: "Sample_ID", editor: "input", width: 160,
      editorParams: { elementAttributes: { placeholder: "auto-suggested or type your own" } },
    }, descHooks("Sample_ID")),
    Object.assign({
      title: "Assay", field: "Assay", width: 140,
      editor: "list",
      editorParams: { values: VALID_ASSAYS, autocomplete: true, listOnEmpty: true, freetext: false },
    }, descHooks("Assay")),
    Object.assign({
      title: "Genome", field: "Genome", width: 120,
      editor: "list",
      editorParams: function() {
        return { values: getDefinedGenomes(), autocomplete: true, listOnEmpty: true, freetext: true };
      },
    }, descHooks("Genome")),
  ];

  // Factor columns (or placeholder/Levels fallback)
  if (factors.length > 0) {
    for (var i = 0; i < factors.length; i++) {
      (function(fname) {
        defs.push(Object.assign({
          title: fname, field: factorField(fname), editor: "input", width: 120,
          editorParams: { elementAttributes: { placeholder: "e.g. WT, mutant" } },
        }, {
          headerClick: (function(fn) { return function() { showFactorDescription(fn); }; })(fname),
          headerMouseEnter: (function(fn) { return function() { showFactorDescription(fn); }; })(fname),
          cellClick: (function(fn) { return function(e, cell) { showFactorDescription(fn); }; })(fname),
        }));
      })(factors[i]);
    }
  } else {
    // No factors defined — show Levels column with guidance
    defs.push(Object.assign({
      title: "Levels", field: "Levels", editor: "input", width: 220,
      editorParams: { elementAttributes: { placeholder: "Add factors above, or type factor:level pairs" } },
    }, descHooks("Levels")));
  }

  defs.push(
    Object.assign({
      title: "Replicate ID", field: "Replicate_ID", editor: "input", width: 110,
      editorParams: { elementAttributes: { placeholder: "e.g. rep1" } },
    }, descHooks("Replicate_ID")),
    Object.assign({
      title: "Read files", field: "Read_files", editor: "input", width: 200,
      editorParams: { elementAttributes: { placeholder: "e.g. SRR12345678" } },
    }, descHooks("Read_files")),
    Object.assign({
      title: "Read layout", field: "Read_layout", width: 110,
      editor: "list",
      editorParams: { values: ["SE", "PE"], listOnEmpty: true, freetext: false },
    }, descHooks("Read_layout")),
    Object.assign({
      title: "IP target", field: "IP_target", editor: "input", width: 120,
      editorParams: { elementAttributes: { placeholder: "e.g. H3K9me2, Input" } },
      editable: function(cell) {
        var assay = (cell.getRow().getData().Assay || "").trim();
        return CHIP_ASSAYS.has(assay);
      },
    }, descHooks("IP_target")),
    Object.assign({
      title: "Control", field: "Control", width: 200,
      editor: "list",
      editorParams: function(cell) {
        return { values: controlListValues(cell), autocomplete: true, listOnEmpty: true, freetext: true };
      },
    }, descHooks("Control"))
  );

  return defs;
}

// ===========================================================================
// Description panel (safe DOM methods only)
// ===========================================================================

const descPanel = document.getElementById("description-panel");
function showFactorDescription(factorName) {
  while (descPanel.firstChild) descPanel.removeChild(descPanel.firstChild);
  var strong = document.createElement("strong");
  strong.textContent = factorName;
  descPanel.appendChild(strong);
  descPanel.appendChild(document.createTextNode(
    " Level of factor '" + factorName + "'. " +
    "Stored as comma-separated factor:level pairs (e.g. genotype:WT,tissue:root) " +
    "in the sample sheet TSV 'Levels' column. All rows must have the same factors. " +
    "Level values form the 'levels_label' in analysis names."
  ));
}

function showDescription(field) {
  const desc = COLUMN_DESCRIPTIONS[field];
  if (desc) {
    // Clear and rebuild with safe DOM methods
    while (descPanel.firstChild) descPanel.removeChild(descPanel.firstChild);
    const strong = document.createElement("strong");
    strong.textContent = field;
    descPanel.appendChild(strong);
    descPanel.appendChild(document.createTextNode(" " + desc));
  }
}

function refreshUI() {
  runValidation();
  applySuggestions();
  applyExampleCellStyles();
}

function clearSuggestion(el) {
  el.classList.remove("cell-suggestion");
  el.removeAttribute("data-suggestion");
  el.title = "";
}

function descHooks(field) {
  return {
    headerClick: function() { showDescription(field); },
    headerMouseEnter: function() { showDescription(field); },
    cellClick: function(e, cell) { showDescription(field); },
  };
}

// ===========================================================================
// Context menu
// ===========================================================================

function closeCtxMenu() {
  if (activeCtxMenu) {
    activeCtxMenu.remove();
    activeCtxMenu = null;
  }
}
document.addEventListener("click", closeCtxMenu);
document.addEventListener("keydown", function(e) { if (e.key === "Escape") closeCtxMenu(); });

function showCtxMenu(e, row) {
  closeCtxMenu();
  const menu = document.createElement("div");
  menu.className = "ctx-menu";
  menu.setAttribute("role", "menu");

  const items = [
    { label: "Add replicate", action: function() { addReplicate(row); } },
    { label: "Duplicate row", action: function() { duplicateRow(row); } },
    { sep: true },
    { label: "Move up", action: function() { moveRow(row, -1); } },
    { label: "Move down", action: function() { moveRow(row, 1); } },
    { sep: true },
    { label: "Remove row", action: function() { removeRow(row); } },
  ];

  for (var ii = 0; ii < items.length; ii++) {
    var item = items[ii];
    if (item.sep) {
      var sep = document.createElement("div");
      sep.className = "ctx-menu-sep";
      menu.appendChild(sep);
      continue;
    }
    var el = document.createElement("div");
    el.textContent = item.label;
    el.setAttribute("role", "menuitem");
    el.setAttribute("tabindex", "0");
    (function(action) {
      el.addEventListener("click", function(ev) { ev.stopPropagation(); closeCtxMenu(); action(); });
      el.addEventListener("keydown", function(ev) { if (ev.key === "Enter") { ev.stopPropagation(); closeCtxMenu(); action(); } });
    })(item.action);
    menu.appendChild(el);
  }

  // Position
  var x = (e.clientX || e.pageX || 100);
  var y = (e.clientY || e.pageY || 100);
  menu.style.left = x + "px";
  menu.style.top = y + "px";
  document.body.appendChild(menu);

  // Adjust if offscreen
  var rect = menu.getBoundingClientRect();
  if (rect.right > window.innerWidth) menu.style.left = (window.innerWidth - rect.width - 8) + "px";
  if (rect.bottom > window.innerHeight) menu.style.top = (window.innerHeight - rect.height - 8) + "px";

  activeCtxMenu = menu;
}

// ===========================================================================
// Row actions
// ===========================================================================

function addReplicate(row) {
  var data = Object.assign({}, row.getData());
  // Increment replicate
  var rep = data.Replicate_ID || "";
  var m = rep.match(/^(.*?)(\d+)$/);
  if (m) {
    data.Replicate_ID = m[1] + (parseInt(m[2]) + 1);
  } else {
    data.Replicate_ID = rep ? rep + "_2" : "rep1";
  }
  data.Sample_ID = ""; // clear so suggestion kicks in
  data._sid_user_edited = false;
  delete data.id; // new internal id
  table.addRow(data, false, row);
  refreshUI();
}

function duplicateRow(row) {
  var data = Object.assign({}, row.getData());
  data.Sample_ID = data.Sample_ID ? data.Sample_ID + "_copy" : "";
  data._sid_user_edited = !!data.Sample_ID;
  delete data.id;
  table.addRow(data, false, row);
  refreshUI();
}

function moveRow(row, direction) {
  var rows = table.getRows();
  var idx = rows.indexOf(row);
  var targetIdx = idx + direction;
  if (targetIdx < 0 || targetIdx >= rows.length) return;
  if (direction < 0) {
    row.move(rows[targetIdx], true);
  } else {
    row.move(rows[targetIdx], false);
  }
}

function removeRow(row) {
  row.delete();
  refreshUI();
}

// ===========================================================================
// Validation Engine
// ===========================================================================

function runValidation() {
  cellIssues = {};
  var data = table.getData();
  var errors = [];
  var warnings = [];
  var sampleIds = new Set();
  var rows = table.getRows();

  // --- Per-row validation ---
  for (var i = 0; i < data.length; i++) {
    var row = data[i];
    var rowNum = i + 1;
    var sid = (row.Sample_ID || "").trim();
    var assay = (row.Assay || "").trim();
    var genome = (row.Genome || "").trim();
    var levels = (row.Levels || "").trim();
    var rep = (row.Replicate_ID || "").trim();
    var readFiles = (row.Read_files || "").trim();
    var readLayout = (row.Read_layout || "").trim();
    var ipTarget = (row.IP_target || "").trim();
    var control = (row.Control || "").trim();
    var rowKey = rows[i] ? rows[i].getIndex() : i;

    // Sample_ID
    if (!sid) {
      addIssue(cellIssues, errors, rowKey, "Sample_ID", "[X] Row #" + rowNum + ": Sample_ID is required");
    } else {
      if (UNSAFE_CHARS_RE.test(sid))
        addIssue(cellIssues, errors, rowKey, "Sample_ID", "[X] Row #" + rowNum + " '" + sid + "': Sample_ID contains unsafe characters");
      if (DOUBLE_UNDERSCORE_RE.test(sid))
        addIssue(cellIssues, errors, rowKey, "Sample_ID", "[X] Row #" + rowNum + " '" + sid + "': Sample_ID must not contain '__'");
      if (sampleIds.has(sid))
        addIssue(cellIssues, errors, rowKey, "Sample_ID", "[X] Row #" + rowNum + " '" + sid + "': duplicate Sample_ID");
      sampleIds.add(sid);
    }

    // Assay
    if (!VALID_ASSAYS_SET.has(assay))
      addIssue(cellIssues, errors, rowKey, "Assay", "[X] Row #" + rowNum + " '" + sid + "': Assay '" + assay + "' not in [" + VALID_ASSAYS.join(", ") + "]");

    // Genome
    if (!genome)
      addIssue(cellIssues, errors, rowKey, "Genome", "[X] Row #" + rowNum + " '" + sid + "': Genome is required");

    // Levels / Factor validation
    if (factors.length > 0) {
      // Validate each factor field individually
      for (var fi = 0; fi < factors.length; fi++) {
        var fval = (row[factorField(factors[fi])] || "").trim();
        var fField = factorField(factors[fi]);
        if (!fval)
          addIssue(cellIssues, errors, rowKey, fField, "[X] Row #" + rowNum + " '" + sid + "': " + factors[fi] + " level is required");
        else if (fval.includes(":") || fval.includes(","))
          addIssue(cellIssues, errors, rowKey, fField, "[X] Row #" + rowNum + " '" + sid + "': " + factors[fi] + " level must not contain ':' or ','");
      }
    } else {
      // Fallback: validate Levels column directly
      var levels = (row.Levels || "").trim();
      if (!levels) {
        addIssue(cellIssues, errors, rowKey, "Levels", "[X] Row #" + rowNum + " '" + sid + "': Levels is required");
      } else {
        var pairs = levels.split(",");
        for (var pi = 0; pi < pairs.length; pi++) {
          var p = pairs[pi].trim();
          if (!p.includes(":")) {
            addIssue(cellIssues, errors, rowKey, "Levels", "[X] Row #" + rowNum + " '" + sid + "': Levels entry '" + p + "' must be 'factor:level' format");
          } else {
            var parts = p.split(":");
            var factor = parts[0];
            var level = parts.slice(1).join(":");
            if (!factor.trim() || !level.trim())
              addIssue(cellIssues, errors, rowKey, "Levels", "[X] Row #" + rowNum + " '" + sid + "': empty factor name or level in Levels");
          }
        }
      }
    }

    // Replicate_ID
    if (!rep)
      addIssue(cellIssues, errors, rowKey, "Replicate_ID", "[X] Row #" + rowNum + " '" + sid + "': Replicate_ID is required");

    // Read_layout
    if (readLayout !== "SE" && readLayout !== "PE")
      addIssue(cellIssues, errors, rowKey, "Read_layout", "[X] Row #" + rowNum + " '" + sid + "': Read_layout must be 'SE' or 'PE', got '" + readLayout + "'");

    // Read_files
    if (!readFiles) {
      addIssue(cellIssues, errors, rowKey, "Read_files", "[X] Row #" + rowNum + " '" + sid + "': Read_files is required");
    } else {
      var components = readFiles.split("+").map(function(s) { return s.trim(); });
      for (var ci = 0; ci < components.length; ci++) {
        var files = components[ci].split(",").map(function(s) { return s.trim(); });
        var first = files[0];
        if (SRA_REGEX.test(first)) {
          for (var fi = 0; fi < files.length; fi++) {
            if (!SRA_REGEX.test(files[fi]))
              addIssue(cellIssues, errors, rowKey, "Read_files", "[X] Row #" + rowNum + " '" + sid + "': mixed SRA/path in Read_files component");
          }
        } else {
          if (readLayout === "PE" && files.length === 1 && !first.endsWith(".bam"))
            addIssue(cellIssues, errors, rowKey, "Read_files", "[X] Row #" + rowNum + " '" + sid + "': Read_layout is PE but Read_files has only one path (expected comma-separated pair)");
          if (readLayout === "SE" && files.length > 1)
            addIssue(cellIssues, errors, rowKey, "Read_files", "[X] Row #" + rowNum + " '" + sid + "': Read_layout is SE but Read_files has multiple comma-separated paths");
        }
      }
    }

    // IP_target
    if (CHIP_ASSAYS.has(assay)) {
      if (!ipTarget) {
        addIssue(cellIssues, errors, rowKey, "IP_target", "[X] Row #" + rowNum + " '" + sid + "': IP_target is required for " + assay);
      } else {
        // Check known marks vs assay recommendation
        var recommended = getRecommendedAssay(ipTarget);
        if (recommended && recommended !== assay) {
          addIssue(cellIssues, warnings, rowKey, "IP_target",
            "[!] Row #" + rowNum + " '" + sid + "': IP_target '" + ipTarget + "' is typically called with " + recommended + ", but Assay is " + assay, "warnings");
        }
      }
    } else if (assay) {
      if (ipTarget)
        addIssue(cellIssues, errors, rowKey, "IP_target", "[X] Row #" + rowNum + " '" + sid + "': IP_target must be blank for " + assay);
    }

    // Control (assay check only - reference checks below)
    if (control) {
      if (!CONTROL_ASSAYS.has(assay))
        addIssue(cellIssues, errors, rowKey, "Control", "[X] Row #" + rowNum + " '" + sid + "': Control is not allowed for " + assay);
    }
  }

  // --- Cross-row validation ---

  // Levels: consistent factors (only needed when factors are NOT managed via panel)
  if (factors.length === 0) {
    var allRowFactors = [];
    for (var i = 0; i < data.length; i++) {
      var lvl = (data[i].Levels || "").trim();
      if (!lvl) { allRowFactors.push(null); continue; }
      var parsed = parseLevels(lvl);
      allRowFactors.push(parsed ? parsed.map(function(p) { return p.factor; }) : null);
    }
    var refFactorNames = null;
    var refRowNum2 = 1;
    for (var i = 0; i < allRowFactors.length; i++) {
      if (allRowFactors[i] !== null) { refFactorNames = allRowFactors[i]; refRowNum2 = i + 1; break; }
    }
    if (refFactorNames) {
      for (var i = 0; i < allRowFactors.length; i++) {
        var rf = allRowFactors[i];
        if (rf === null) continue;
        if (i + 1 === refRowNum2) continue;
        var rowNum = i + 1;
        var rowKey = rows[i] ? rows[i].getIndex() : i;
        if (rf.length !== refFactorNames.length) {
          addIssue(cellIssues, errors, rowKey, "Levels",
            "[X] Row #" + rowNum + ": Levels has " + rf.length + " factors, expected " + refFactorNames.length + " (matching row " + refRowNum2 + ")");
        } else if (rf.join("\0") !== refFactorNames.join("\0")) {
          addIssue(cellIssues, errors, rowKey, "Levels",
            "[X] Row #" + rowNum + ": Levels factor names [" + rf.join(",") + "] don't match row " + refRowNum2 + " [" + refFactorNames.join(",") + "]");
        }
      }
    }
  }

  // Read_files: cross-row duplicate check
  var seenInputs = {};  // path/accession -> Sample_ID
  for (var i = 0; i < data.length; i++) {
    var readFiles = (data[i].Read_files || "").trim();
    var sid = (data[i].Sample_ID || "").trim();
    var rowNum = i + 1;
    var rowKey = rows[i] ? rows[i].getIndex() : i;
    if (!readFiles) continue;
    var components = readFiles.split("+").map(function(s) { return s.trim(); });
    for (var ci = 0; ci < components.length; ci++) {
      var files = components[ci].split(",").map(function(s) { return s.trim(); });
      for (var fi = 0; fi < files.length; fi++) {
        var f = files[fi];
        if (!f) continue;
        if (seenInputs[f]) {
          addIssue(cellIssues, errors, rowKey, "Read_files",
            "[X] Row #" + rowNum + " '" + sid + "': Read_files entry '" + f + "' is also used by '" + seenInputs[f] + "'");
        } else {
          seenInputs[f] = sid;
        }
      }
    }
  }

  // Control: reference validation
  // Build O(1) lookup from Sample_ID → row data (sampleIds Set already complete from per-row loop)
  var sidToRow = new Map();
  for (var i = 0; i < data.length; i++) {
    var s = (data[i].Sample_ID || "").trim();
    if (s) sidToRow.set(s, data[i]);
  }
  for (var i = 0; i < data.length; i++) {
    var control = (data[i].Control || "").trim();
    var sid = (data[i].Sample_ID || "").trim();
    var rowNum = i + 1;
    var rowKey = rows[i] ? rows[i].getIndex() : i;
    if (!control) continue;

    if (!sampleIds.has(control)) {
      addIssue(cellIssues, errors, rowKey, "Control",
        "[X] Row #" + rowNum + " '" + sid + "': Control '" + control + "' does not match any Sample_ID in the sheet");
    } else {
      // No chaining
      var ctrlRow = sidToRow.get(control);
      if (ctrlRow) {
        var ctrlCtrl = (ctrlRow.Control || "").trim();
        if (ctrlCtrl) {
          addIssue(cellIssues, errors, rowKey, "Control",
            "[X] Row #" + rowNum + " '" + sid + "': Control '" + control + "' itself has a Control (chaining not allowed)");
        }
      }
    }
  }

  // --- Update UI ---
  updateCellStyles();
  renderDiagnostics(errors, warnings);
}

function addIssue(issues, list, rowKey, field, msg, severity) {
  list.push(msg);
  var key = rowKey + ":" + field;
  if (!issues[key]) issues[key] = { errors: [], warnings: [] };
  issues[key][severity || "errors"].push(msg);
}

function updateCellStyles() {
  var rows = table.getRows();
  var visibleFields = getVisibleFields();
  for (var ri = 0; ri < rows.length; ri++) {
    var rowKey = rows[ri].getIndex();
    for (var ci = 0; ci < visibleFields.length; ci++) {
      var field = visibleFields[ci];
      var cell = rows[ri].getCell(field);
      if (!cell) continue;
      var cellEl = cell.getElement();
      cellEl.classList.remove("cell-error", "cell-warning");
      var key = rowKey + ":" + field;
      var issues = cellIssues[key];
      if (issues && issues.errors.length > 0) {
        cellEl.classList.add("cell-error");
      } else if (issues && issues.warnings.length > 0) {
        cellEl.classList.add("cell-warning");
      }
    }
  }
}

var _lastDiagKey = "";

function appendDiagSection(panel, items, cssClass, label) {
  if (items.length === 0) return;
  var summary = document.createElement("div");
  summary.className = "diag-summary " + cssClass;
  summary.textContent = items.length + " " + label + (items.length > 1 ? "s" : "");
  panel.appendChild(summary);
  for (var i = 0; i < items.length; i++) {
    var div = document.createElement("div");
    div.className = cssClass;
    div.textContent = items[i];
    panel.appendChild(div);
  }
}

function renderDiagnostics(errors, warnings) {
  // Toggle export button based on validation errors
  var exportBtn = document.getElementById("btn-export");
  if (errors.length > 0) {
    exportBtn.disabled = true;
    exportBtn.title = "Fix validation errors to enable export";
    exportBtn.setAttribute("aria-disabled", "true");
  } else {
    exportBtn.disabled = false;
    exportBtn.title = "";
    exportBtn.removeAttribute("aria-disabled");
  }

  // Skip DOM rebuild if content is unchanged — prevents focus theft
  var newKey = errors.join("\n") + "\n---\n" + warnings.join("\n");
  if (newKey === _lastDiagKey) return;
  _lastDiagKey = newKey;

  // Save and restore focus so panel rebuild doesn't steal it
  var focused = document.activeElement;

  var panel = document.getElementById("diagnostics-panel");
  while (panel.firstChild) panel.removeChild(panel.firstChild);

  if (errors.length === 0 && warnings.length === 0) {
    if (focused && focused !== document.body) focused.focus();
    return;
  }

  appendDiagSection(panel, errors,   "diag-error",   "error");
  appendDiagSection(panel, warnings, "diag-warning", "warning");

  // Restore focus if it was lost during rebuild
  if (focused && focused !== document.body && document.activeElement !== focused) {
    focused.focus();
  }
}

function applySuggestions() {
  var rows = table.getRows();
  for (var ri = 0; ri < rows.length; ri++) {
    var data = rows[ri].getData();
    var sid = (data.Sample_ID || "").trim();
    var userEdited = !!data._sid_user_edited;
    var cell = rows[ri].getCell("Sample_ID");
    if (!cell) continue;
    var cellEl = cell.getElement();
    var suggestion = suggestSampleId(data);

    if (!userEdited) {
      // Auto-update: set the actual cell value to the suggestion
      if (suggestion) {
        if (sid !== suggestion) {
          cell.setValue(suggestion, true);  // true = don't trigger cellEdited
        }
        cellEl.classList.add("cell-suggestion");
        cellEl.setAttribute("data-suggestion", suggestion);
        cellEl.title = "Suggested: " + suggestion;
      } else if (!sid) {
        clearSuggestion(cellEl);
      } else {
        clearSuggestion(cellEl);
      }
    } else {
      // User has manually edited — don't touch the value
      clearSuggestion(cellEl);
    }
  }
}

function downloadBlob(content, mimeType, filename) {
  var blob = new Blob([content], { type: mimeType });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(function() { URL.revokeObjectURL(url); }, 200);
}

function readFileAsText(inputElement, callback) {
  var file = inputElement.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) { callback(ev.target.result); };
  reader.readAsText(file);
  inputElement.value = "";
}

function importTSV(text) {
  var lines = text.split(/\r?\n/).filter(function(l) { return l.trim(); });
  if (lines.length < 1) return;

  var header = lines[0].split("\t").map(function(s) { return s.trim(); });
  // Validate header
  var missing = COLUMNS.filter(function(c) { return header.indexOf(c) === -1; });
  if (missing.length > 0) {
    alert("Import error: missing columns: " + missing.join(", ") +
      "\n\nExpected: " + COLUMNS.join(", ") +
      "\nFound: " + header.join(", "));
    return;
  }

  var colIdx = {};
  for (var ci = 0; ci < COLUMNS.length; ci++) {
    colIdx[COLUMNS[ci]] = header.indexOf(COLUMNS[ci]);
  }

  var rows = [];
  for (var i = 1; i < lines.length; i++) {
    var fields = lines[i].split("\t");
    var row = {};
    for (var ci = 0; ci < COLUMNS.length; ci++) {
      var c = COLUMNS[ci];
      row[c] = (fields[colIdx[c]] || "").trim();
    }
    rows.push(row);
  }

  // Extract factors from the Levels column and set up factor columns
  var importedFactors = [];
  for (var i = 0; i < rows.length; i++) {
    var parsed = parseLevels(rows[i].Levels || "");
    if (parsed && parsed.length > 0) {
      importedFactors = parsed.map(function(p) { return p.factor; });
      break;
    }
  }

  // Set global factors and populate _factor_* fields
  factors = importedFactors;
  for (var i = 0; i < rows.length; i++) {
    populateFactorsFromLevels(rows[i]);
    // Imported rows with a Sample_ID are treated as user-edited
    rows[i]._sid_user_edited = !!(rows[i].Sample_ID || "").trim();
  }

  // Rebuild columns for the new factors
  rebuildTableColumns();
  renderFactorTiles();

  table.setData(rows);
  setTimeout(function() { refreshUI(); }, 100);
}

function exportTSV() {
  var data = table.getData();
  if (data.length === 0) { alert("No data to export."); return; }
  // Reconstruct Levels from factor fields before export
  if (factors.length > 0) {
    for (var i = 0; i < data.length; i++) {
      data[i].Levels = buildLevelsFromFactors(data[i]);
    }
  }
  // Accept suggestions for empty Sample_IDs
  for (var i = 0; i < data.length; i++) {
    if (!(data[i].Sample_ID || "").trim()) {
      var suggestion = suggestSampleId(data[i]);
      if (suggestion) data[i].Sample_ID = suggestion;
    }
  }
  var lines = [COLUMNS.join("\t")];
  for (var i = 0; i < data.length; i++) {
    lines.push(COLUMNS.map(function(c) { var v = data[i][c]; return (v == null) ? "" : String(v); }).join("\t"));
  }
  downloadBlob(lines.join("\n") + "\n", "text/tab-separated-values", "sample_sheet.tsv");
}

// Build a filtered list of compatible Control candidates for a given row's Assay.
// ChIP_broad/ChIP_narrow: controls must be ChIP_broad or ChIP_narrow samples.
// RAMPAGE: controls must be RNAseq samples.
function controlListValues(cell) {
  var rowData = cell.getRow().getData();
  var assay = (rowData.Assay || "").trim();
  var currentSid = (rowData.Sample_ID || "").trim();
  var allData = table.getData();

  // Determine which assays are valid sources for controls
  var validSourceAssays = CONTROL_SOURCE_ASSAYS[assay];
  if (!validSourceAssays) {
    return [{ label: "(None available)", value: "", disabled: true }];
  }

  var candidates = [];
  for (var i = 0; i < allData.length; i++) {
    var sid = (allData[i].Sample_ID || "").trim();
    var sAssay = (allData[i].Assay || "").trim();
    if (!sid || sid === currentSid) continue;
    if (validSourceAssays.has(sAssay)) {
      candidates.push(sid);
    }
  }

  if (candidates.length === 0) {
    return [{ label: "(None available)", value: "", disabled: true }];
  }
  return [""].concat(candidates);
}

// Editable column fields in Tab order (excludes _actions) — updated by rebuildTableColumns()
var EDIT_FIELDS = getVisibleFields();

table = new Tabulator("#table-container", {
  data: EXAMPLE_DATA,
  columns: buildColumnDefs(),
  layout: "fitDataFill",
  selectableRows: true,
  movableRows: true,
  history: true,
  placeholder: "No data \u2014 click '+ Add Row' or import a TSV file",
  rowHeight: 32,
  index: "id",
  reactiveData: false,
  // Keep Tab within the table: wrap from last cell to next row, last row to first
  navigatorNextCell: function(cell, direction) {
    var row = cell.getRow();
    var field = cell.getField();
    var idx = EDIT_FIELDS.indexOf(field);
    if (idx < EDIT_FIELDS.length - 1) {
      // Move to next column in same row
      return row.getCell(EDIT_FIELDS[idx + 1]);
    }
    // End of row — move to first column of next row
    var rows = table.getRows();
    var rowIdx = rows.indexOf(row);
    if (rowIdx < rows.length - 1) {
      return rows[rowIdx + 1].getCell(EDIT_FIELDS[0]);
    }
    // Last cell of last row — wrap to first cell of first row
    return rows[0].getCell(EDIT_FIELDS[0]);
  },
  navigatorPrevCell: function(cell, direction) {
    var row = cell.getRow();
    var field = cell.getField();
    var idx = EDIT_FIELDS.indexOf(field);
    if (idx > 0) {
      // Move to previous column in same row
      return row.getCell(EDIT_FIELDS[idx - 1]);
    }
    // Start of row — move to last column of previous row
    var rows = table.getRows();
    var rowIdx = rows.indexOf(row);
    if (rowIdx > 0) {
      return rows[rowIdx - 1].getCell(EDIT_FIELDS[EDIT_FIELDS.length - 1]);
    }
    // First cell of first row — wrap to last cell of last row
    return rows[rows.length - 1].getCell(EDIT_FIELDS[EDIT_FIELDS.length - 1]);
  },
});

// --- Editing-aware validation scheduling ---
// Validation modifies DOM (cell classes, diagnostics panel) which steals focus
// from Tabulator editors. We track editing state and only run validation when
// no cell editor is open.
var _editingActive = false;
var _validationDirty = false;

function scheduleValidation() {
  _validationDirty = true;
  // Check after a tick whether editing has stopped
  setTimeout(function() {
    if (!_editingActive && _validationDirty) {
      _validationDirty = false;
      refreshUI();
    }
  }, 20);
}

function flushValidationIfIdle() {
  if (!_editingActive && _validationDirty) {
    _validationDirty = false;
    refreshUI();
  }
}

// Per-cell example editing: let editor open with example text (user types over it).
// cellEdited fires only when the value actually changes; cellEditCancelled fires
// when the user presses Escape or commits without changing the value.
table.on("cellEditing", function(cell) {
  _editingActive = true;
  var row = cell.getRow();
  var data = row.getData();
  var field = cell.getField();

  // For factor fields, check if "Levels" is still in exampleData
  var isExampleField = data._exampleData && (field in data._exampleData ||
    (isFactorField(field) && "Levels" in data._exampleData));

  if (isExampleField) {
    // Stash that this is an example cell; remove dimmed styling while editing
    _editingExampleStash = { field: field };
    cell.getElement().classList.remove("cell-example");
    // Select all text so typing immediately replaces the example value
    setTimeout(function() {
      var input = cell.getElement().querySelector("input");
      if (input) input.select();
    }, 0);
  } else {
    _editingExampleStash = null;
    // For real rows, the Sample_ID already has the suggestion as its value
    // (set by applySuggestions), so no special handling needed here
  }
});

table.on("cellEdited", function(cell) {
  _editingActive = false;
  var row = cell.getRow();
  var data = row.getData();
  var field = cell.getField();

  // User committed a real change on an example cell — mark this field as edited
  if (data._exampleData) {
    if (field in data._exampleData) {
      delete data._exampleData[field];
    } else if (isFactorField(field) && "Levels" in data._exampleData) {
      // Editing any factor field clears the Levels example
      delete data._exampleData["Levels"];
      // Also clear all factor fields from exampleData
      var keys = Object.keys(data._exampleData);
      for (var ki = 0; ki < keys.length; ki++) {
        if (isFactorField(keys[ki])) delete data._exampleData[keys[ki]];
      }
    }
    // Enable validation by clearing _example on first real edit
    if (data._example) {
      data._example = false;
    }
  }
  _editingExampleStash = null;

  // Track manual Sample_ID edits for auto-suggestion behavior
  if (field === "Sample_ID") {
    var newVal = (cell.getValue() || "").trim();
    var suggestion = suggestSampleId(row.getData());
    if (!newVal) {
      // Clearing Sample_ID resumes auto-suggestion
      row.update({ _sid_user_edited: false });
    } else if (newVal !== suggestion) {
      // User typed something different from the suggestion
      row.update({ _sid_user_edited: true });
    }
    // If newVal === suggestion, keep current _sid_user_edited state
  }

  // When Assay changes, clear IP_target for non-ChIP
  if (field === "Assay") {
    var assay = (cell.getValue() || "").trim();
    if (!CHIP_ASSAYS.has(assay)) {
      row.update({ IP_target: "" });
    }
  }
  scheduleValidation();
});

table.on("cellEditCancelled", function(cell) {
  _editingActive = false;
  // Restore example styling — value was never changed so no need to restore it
  if (_editingExampleStash && _editingExampleStash.field === cell.getField()) {
    cell.getElement().classList.add("cell-example");
  }
  _editingExampleStash = null;
  flushValidationIfIdle();
});

table.on("rowDeleted", function() { scheduleValidation(); });
table.on("rowMoved", function() { scheduleValidation(); });
table.on("rowSelectionChanged", function(rows) {
  var hasSelection = rows.length > 0;
  document.getElementById("btn-dup-selected").disabled = !hasSelection;
  document.getElementById("btn-del-selected").disabled = !hasSelection;
});

  // Build genomes tab now that table data is available
  buildGenomesTab();
});

  if ((e.ctrlKey && e.shiftKey && e.key === "Z") || (e.ctrlKey && e.key === "y")) {
    table.redo();
    refreshUI();
  }
});

// Shorthand DOM helper
function el(tag, props, children) {
  var e = document.createElement(tag);
  if (props) {
    for (var k in props) {
      if (k === "className") e.className = props[k];
      else if (k === "textContent") e.textContent = props[k];
      else if (k === "htmlFor") e.htmlFor = props[k];
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), props[k]);
      else e.setAttribute(k, props[k]);
    }
  }
  if (children) {
    if (!Array.isArray(children)) children = [children];
    for (var i = 0; i < children.length; i++) {
      if (typeof children[i] === "string") e.appendChild(document.createTextNode(children[i]));
      else if (children[i]) e.appendChild(children[i]);
    }
  }
  return e;
}

function buildTextRow(label, key, placeholder, help) {
  var row = el("div", { className: "cfg-row" });
  row.appendChild(el("label", { htmlFor: "cfg-" + key, textContent: label }));
  var inp = el("input", {
    type: "text", id: "cfg-" + key, placeholder: placeholder || "",
    value: configState[key] || "",
    oninput: function() { configState[key] = this.value; }
  });
  row.appendChild(inp);
  if (help) row.appendChild(el("div", { className: "cfg-help", textContent: help }));
  return row;
}

function buildSelectRow(label, key, options) {
  var row = el("div", { className: "cfg-row" });
  row.appendChild(el("label", { htmlFor: "cfg-" + key, textContent: label }));
  var sel = el("select", {
    id: "cfg-" + key,
    onchange: function() { configState[key] = this.value; }
  });
  for (var i = 0; i < options.length; i++) {
    var opt = el("option", { value: options[i], textContent: options[i] });
    if (configState[key] === options[i]) opt.selected = true;
    sel.appendChild(opt);
  }
  row.appendChild(sel);
  return row;
}

function buildNumberRow(label, key, min, max) {
  var row = el("div", { className: "cfg-row" });
  row.appendChild(el("label", { htmlFor: "cfg-" + key, textContent: label }));
  var inp = el("input", {
    type: "number", id: "cfg-" + key, min: String(min || 1), max: String(max || 100000),
    value: String(configState[key] || 0),
    oninput: function() { configState[key] = parseFloat(this.value) || 0; }
  });
  row.appendChild(inp);
  return row;
}

function buildToggleRow(label, key, msgOn, msgOff) {
  var wrap = el("div", { className: "cfg-toggle-row" });
  var sw = el("label", { className: "toggle-switch" });
  var cb = el("input", { type: "checkbox" });
  cb.checked = !!configState[key];
  var slider = el("span", { className: "toggle-slider" });
  sw.appendChild(cb);
  sw.appendChild(slider);
  wrap.appendChild(sw);
  wrap.appendChild(el("label", { textContent: label }));
  var msgEl = el("div", { className: "cfg-msg" });
  msgEl.textContent = configState[key] ? msgOn : msgOff;
  cb.addEventListener("change", function() {
    configState[key] = this.checked;
    msgEl.textContent = this.checked ? msgOn : msgOff;
  });
  wrap.appendChild(msgEl);
  return wrap;
}

function buildBoundTextRow(label, stateObj, key, placeholder, ariaHint) {
  var row = el("div", { className: "cfg-row" });
  row.appendChild(el("label", { textContent: label }));
  var attrs = { type: "text", placeholder: placeholder, value: stateObj[key] || "" };
  if (ariaHint) attrs["aria-label"] = label + " (example: " + ariaHint + ")";
  var inp = el("input", attrs);
  inp.addEventListener("input", function() { stateObj[key] = this.value; });
  row.appendChild(inp);
  return row;
}
