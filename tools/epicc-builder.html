  container.appendChild(plotDet);

  // --- Footer ---
  container.appendChild(el("div", { className: "cfg-footer",
    textContent: "More options are available to those who can directly change the yamls... \uD83E\uDD13" }));
  _configFormBuilt = true;
}

// Get unique genome names from sample sheet data
function getGenomesFromSampleSheet() {
  var data = table.getData();
  var seen = {};
  var genomes = [];
  for (var i = 0; i < data.length; i++) {
    var g = (data[i].Genome || "").trim();
    if (g && !seen[g]) {
      seen[g] = true;
      genomes.push(g);
    }
  }
  return genomes;
}

// Get unique species names from genome config
// Rebuild dynamic config sections (genomes are now in their own tab)
function updateConfigDynamicSections() {
  if (!_configFormBuilt) {
    buildConfigForm();
  }
}

// ===========================================================================
// YAML Export / Import
// ===========================================================================

function configStateToYAML() {
  var cfg = {};
  cfg.repo_folder = configState.repo_folder;
  cfg.analysis_name = configState.analysis_name;
  cfg.sample_file = configState.sample_file;

  // Genomes (namespaced under genomes: key)
  cfg.genomes = {};
  for (var gn in configState.genomes) {
    var g = configState.genomes[gn];
    cfg.genomes[gn] = {};
    if (g.species) cfg.genomes[gn].species = g.species.replace(/ /g, "_");
    if (g.fasta_file) cfg.genomes[gn].fasta_file = g.fasta_file;
    if (g.gff_file) cfg.genomes[gn].gff_file = g.gff_file;
    if (g.gtf_file && g.gtf_file !== "<auto>") cfg.genomes[gn].gtf_file = g.gtf_file;
    if (g.gaf_file) cfg.genomes[gn].gaf_file = g.gaf_file;
    if (g.gene_info_file) cfg.genomes[gn].gene_info_file = g.gene_info_file;
    if (g.te_file) cfg.genomes[gn].te_file = g.te_file;
    if (g.structural_rna_fafile && g.structural_rna_fafile !== "<auto>") cfg.genomes[gn].structural_rna_fafile = g.structural_rna_fafile;
    if (g.star_index) cfg.genomes[gn].star_index = g.star_index;
    if (g.genomesize) {
      var gs = parseFloat(g.genomesize);
      cfg.genomes[gn].genomesize = isNaN(gs) ? g.genomesize : gs;
    }
    if (g.ncbi_taxid && g.ncbi_taxid !== "<auto>") cfg.genomes[gn].ncbi_taxid = g.ncbi_taxid;
    if (g.genus) cfg.genomes[gn].genus = g.genus;
  }

  // Output options
  cfg.full_analysis = configState.full_analysis;
  cfg.te_analysis = configState.te_analysis;
  cfg.QC_option = configState.QC_option;
  cfg.GO = configState.GO;

  // Input options
  cfg.trimmed_fastqs = configState.trimmed_fastqs;
  cfg.aligned_bams = configState.aligned_bams;

  // Intermediate file retention
  cfg.keep_intermediates = configState.keep_intermediates;
  if (configState.keep_intermediates === "custom") {
    cfg.keep_trimmed_fastqs = configState.keep_trimmed_fastqs;
    cfg.keep_final_bams = configState.keep_final_bams;
    cfg.keep_merged_bams = configState.keep_merged_bams;
    cfg.keep_shifted_bams = configState.keep_shifted_bams;
    cfg.keep_cx_reports = configState.keep_cx_reports;
    cfg.keep_dmc_intermediates = configState.keep_dmc_intermediates;
  }

  // Trimming (fastp)
  cfg.quality_threshold = {
    ChIP: configState.quality_threshold_ChIP,
    RNA: configState.quality_threshold_RNA,
    mC: configState.quality_threshold_mC,
    sRNA: configState.quality_threshold_sRNA,
    ATAC: configState.quality_threshold_ATAC
  };
  cfg.min_read_length = {
    ChIP: configState.min_read_length_ChIP,
    RNA: configState.min_read_length_RNA,
    mC: configState.min_read_length_mC,
    sRNA: configState.min_read_length_sRNA,
    ATAC: configState.min_read_length_ATAC
  };
  cfg.trim_front = {
    ChIP: configState.trim_front_ChIP,
    RNA: configState.trim_front_RNA,
    mC: configState.trim_front_mC,
    sRNA: configState.trim_front_sRNA,
    ATAC: configState.trim_front_ATAC
  };
  cfg.adapter1 = {
    ChIP: configState.adapter1_ChIP,
    RNA: configState.adapter1_RNA,
    mC: configState.adapter1_mC,
    sRNA: configState.adapter1_sRNA,
    ATAC: configState.adapter1_ATAC
  };
  cfg.adapter2 = {
    ChIP: configState.adapter2_ChIP,
    RNA: configState.adapter2_RNA,
    mC: configState.adapter2_mC,
    sRNA: configState.adapter2_sRNA,
    ATAC: configState.adapter2_ATAC
  };

  cfg.chip_fingerprint_plots = configState.chip_fingerprint_plots;
  cfg.fingerprint_samples = configState.fingerprint_samples;
  cfg.chip_aligner = configState.chip_aligner;
  cfg.atac_aligner = configState.atac_aligner;
  cfg.chip_mapping_strategy = configState.chip_mapping_strategy;
  cfg.atac_mapping_strategy = configState.atac_mapping_strategy;
  cfg.chip_tracks = {
    binsize: configState.chip_tracks_binsize,
    params: configState.chip_tracks_params
  };
  cfg.chip_callpeaks = {
    params: configState.chip_callpeaks_params
  };
  cfg.upset_allreps = configState.upset_allreps;

  // RNA
  cfg.rna_tracks = {
    RNAseq: {
      file_order: "rnaseq",
      param_bg: "--outWigType bedGraph",
      strandedness: configState.rna_strandedness,
      multimap: configState.rna_multimap
    }
  };

  // mC
  cfg.custom_script_dmrs = configState.custom_script_dmrs;

  // sRNA
  cfg.nextflex_v3_deduplication = configState.nextflex_v3_deduplication;
  cfg.structural_rna_depletion = configState.structural_rna_depletion;
  cfg.infernal_threshold = configState.infernal_threshold;
  cfg.srna_mapping_params = configState.srna_mapping_params;
  cfg.srna_min_size = configState.srna_min_size;
  cfg.srna_max_size = configState.srna_max_size;
  // Parse heatmap sizes string to array
  var heatSizes = (configState.srna_heatmap_sizes || "").split(",").map(function(s) {
    return parseInt(s.trim());
  }).filter(function(n) { return !isNaN(n); });
  cfg.srna_heatmap_sizes = heatSizes;

  // Motifs
  cfg.motifs = configState.motifs;
  cfg.motifs_allreps = configState.motifs_allreps;
  cfg.jaspar_db = configState.jaspar_db;

  // Plotting
  cfg.plot_allreps = configState.plot_allreps;
  cfg.heatmaps_scales = configState.heatmaps_scales;
  cfg.stranded_heatmaps = configState.stranded_heatmaps;
  cfg.heatmaps_sort_options = configState.heatmaps_sort_options;
  cfg.heatmap_sort_mc_after_others = configState.heatmap_sort_mc_after_others;
  cfg.profiles_scale = configState.profiles_scale;
  cfg.profiles_plot_params = configState.profiles_plot_params;
  cfg.browser_TE_file = configState.browser_TE_file;
  cfg.browser_scales = configState.browser_scales;

  return cfg;
}

function exportYAML() {
  var cfg = configStateToYAML();
  var yamlStr = jsyaml.dump(cfg, { sortKeys: false, lineWidth: -1, noRefs: true });
  downloadBlob(yamlStr, "application/x-yaml", "epicc-options.yaml");
}

function handleYAMLImport(text) {
  var cfg;
  try {
    cfg = jsyaml.load(text);
  } catch (e) {
    alert("YAML parse error: " + e.message);
    return;
  }
  if (!cfg || typeof cfg !== "object") {
    alert("Invalid YAML: expected an object at the top level.");
    return;
  }

  // Simple fields
  if (cfg.repo_folder != null) configState.repo_folder = cfg.repo_folder;
  if (cfg.analysis_name != null) configState.analysis_name = cfg.analysis_name;
  if (cfg.sample_file != null) configState.sample_file = cfg.sample_file;
  if (cfg.full_analysis != null) configState.full_analysis = !!cfg.full_analysis;
  if (cfg.te_analysis != null) configState.te_analysis = !!cfg.te_analysis;
  if (cfg.QC_option != null) configState.QC_option = String(cfg.QC_option);
  if (cfg.GO != null) configState.GO = !!cfg.GO;
  if (cfg.trimmed_fastqs != null) configState.trimmed_fastqs = !!cfg.trimmed_fastqs;
  if (cfg.aligned_bams != null) configState.aligned_bams = !!cfg.aligned_bams;
  if (cfg.keep_intermediates != null) configState.keep_intermediates = String(cfg.keep_intermediates);
  if (cfg.keep_trimmed_fastqs != null) configState.keep_trimmed_fastqs = !!cfg.keep_trimmed_fastqs;
  if (cfg.keep_final_bams != null) configState.keep_final_bams = !!cfg.keep_final_bams;
  if (cfg.keep_merged_bams != null) configState.keep_merged_bams = !!cfg.keep_merged_bams;
  if (cfg.keep_shifted_bams != null) configState.keep_shifted_bams = !!cfg.keep_shifted_bams;
  if (cfg.keep_cx_reports != null) configState.keep_cx_reports = !!cfg.keep_cx_reports;
  if (cfg.keep_dmc_intermediates != null) configState.keep_dmc_intermediates = !!cfg.keep_dmc_intermediates;
  if (cfg.motifs != null) configState.motifs = !!cfg.motifs;
  if (cfg.jaspar_db != null) configState.jaspar_db = cfg.jaspar_db;
  if (cfg.motifs_allreps != null) configState.motifs_allreps = !!cfg.motifs_allreps;
  if (cfg.chip_fingerprint_plots != null) configState.chip_fingerprint_plots = !!cfg.chip_fingerprint_plots;
  if (cfg.fingerprint_samples != null) configState.fingerprint_samples = String(cfg.fingerprint_samples);
  if (cfg.chip_aligner != null) configState.chip_aligner = cfg.chip_aligner;
  if (cfg.atac_aligner != null) configState.atac_aligner = cfg.atac_aligner;
  if (cfg.chip_mapping_strategy != null) configState.chip_mapping_strategy = cfg.chip_mapping_strategy;
  else if (cfg.chip_mapping_option != null) configState.chip_mapping_strategy = cfg.chip_mapping_option;
  if (cfg.atac_mapping_strategy != null) configState.atac_mapping_strategy = cfg.atac_mapping_strategy;
  else if (cfg.atac_mapping_option != null) configState.atac_mapping_strategy = cfg.atac_mapping_option;
  if (cfg.custom_script_dmrs != null) configState.custom_script_dmrs = !!cfg.custom_script_dmrs;
  if (cfg.nextflex_v3_deduplication != null) configState.nextflex_v3_deduplication = !!cfg.nextflex_v3_deduplication;
  if (cfg.structural_rna_depletion != null) configState.structural_rna_depletion = !!cfg.structural_rna_depletion;
  if (cfg.infernal_threshold != null) configState.infernal_threshold = String(cfg.infernal_threshold);
  if (cfg.srna_mapping_params != null) configState.srna_mapping_params = cfg.srna_mapping_params;
  if (cfg.srna_min_size != null) configState.srna_min_size = cfg.srna_min_size;
  if (cfg.srna_max_size != null) configState.srna_max_size = cfg.srna_max_size;
  if (cfg.srna_heatmap_sizes != null) {
    configState.srna_heatmap_sizes = Array.isArray(cfg.srna_heatmap_sizes)
      ? cfg.srna_heatmap_sizes.join(", ") : String(cfg.srna_heatmap_sizes);
  }
  if (cfg.plot_allreps != null) configState.plot_allreps = !!cfg.plot_allreps;
  if (cfg.upset_allreps != null) configState.upset_allreps = !!cfg.upset_allreps;
  if (cfg.heatmaps_scales != null) configState.heatmaps_scales = cfg.heatmaps_scales;
  if (cfg.stranded_heatmaps != null) configState.stranded_heatmaps = !!cfg.stranded_heatmaps;
  if (cfg.heatmaps_sort_options != null) configState.heatmaps_sort_options = cfg.heatmaps_sort_options;
  if (cfg.heatmap_sort_mc_after_others != null) configState.heatmap_sort_mc_after_others = !!cfg.heatmap_sort_mc_after_others;
  if (cfg.profiles_scale != null) configState.profiles_scale = cfg.profiles_scale;
  if (cfg.profiles_plot_params != null) configState.profiles_plot_params = cfg.profiles_plot_params;
  if (cfg.browser_TE_file != null) configState.browser_TE_file = !!cfg.browser_TE_file;
  if (cfg.browser_scales != null) configState.browser_scales = cfg.browser_scales;

  // Trimming/adapter nested objects (fastp)
  if (cfg.quality_threshold) {
    if (cfg.quality_threshold.ChIP != null) configState.quality_threshold_ChIP = cfg.quality_threshold.ChIP;
    if (cfg.quality_threshold.RNA != null) configState.quality_threshold_RNA = cfg.quality_threshold.RNA;
    if (cfg.quality_threshold.mC != null) configState.quality_threshold_mC = cfg.quality_threshold.mC;
    if (cfg.quality_threshold.sRNA != null) configState.quality_threshold_sRNA = cfg.quality_threshold.sRNA;
    if (cfg.quality_threshold.ATAC != null) configState.quality_threshold_ATAC = cfg.quality_threshold.ATAC;
  }
  if (cfg.min_read_length) {
    if (cfg.min_read_length.ChIP != null) configState.min_read_length_ChIP = cfg.min_read_length.ChIP;
    if (cfg.min_read_length.RNA != null) configState.min_read_length_RNA = cfg.min_read_length.RNA;
    if (cfg.min_read_length.mC != null) configState.min_read_length_mC = cfg.min_read_length.mC;
    if (cfg.min_read_length.sRNA != null) configState.min_read_length_sRNA = cfg.min_read_length.sRNA;
    if (cfg.min_read_length.ATAC != null) configState.min_read_length_ATAC = cfg.min_read_length.ATAC;
  }
  if (cfg.trim_front) {
    if (cfg.trim_front.ChIP != null) configState.trim_front_ChIP = cfg.trim_front.ChIP;
    if (cfg.trim_front.RNA != null) configState.trim_front_RNA = cfg.trim_front.RNA;
    if (cfg.trim_front.mC != null) configState.trim_front_mC = cfg.trim_front.mC;
    if (cfg.trim_front.sRNA != null) configState.trim_front_sRNA = cfg.trim_front.sRNA;
    if (cfg.trim_front.ATAC != null) configState.trim_front_ATAC = cfg.trim_front.ATAC;
  }
  if (cfg.adapter1) {
    if (cfg.adapter1.ChIP != null) configState.adapter1_ChIP = cfg.adapter1.ChIP;
    if (cfg.adapter1.RNA != null) configState.adapter1_RNA = cfg.adapter1.RNA;
    if (cfg.adapter1.mC != null) configState.adapter1_mC = cfg.adapter1.mC;
    if (cfg.adapter1.sRNA != null) configState.adapter1_sRNA = cfg.adapter1.sRNA;
    if (cfg.adapter1.ATAC != null) configState.adapter1_ATAC = cfg.adapter1.ATAC;
  }
  if (cfg.adapter2) {
    if (cfg.adapter2.ChIP != null) configState.adapter2_ChIP = cfg.adapter2.ChIP;
    if (cfg.adapter2.RNA != null) configState.adapter2_RNA = cfg.adapter2.RNA;
    if (cfg.adapter2.mC != null) configState.adapter2_mC = cfg.adapter2.mC;
    if (cfg.adapter2.sRNA != null) configState.adapter2_sRNA = cfg.adapter2.sRNA;
    if (cfg.adapter2.ATAC != null) configState.adapter2_ATAC = cfg.adapter2.ATAC;
  }

  // ChIP tracks
  if (cfg.chip_tracks) {
    if (cfg.chip_tracks.binsize != null) configState.chip_tracks_binsize = cfg.chip_tracks.binsize;
    if (cfg.chip_tracks.params != null) configState.chip_tracks_params = cfg.chip_tracks.params;
  }
  if (cfg.chip_callpeaks && cfg.chip_callpeaks.params != null) {
    configState.chip_callpeaks_params = cfg.chip_callpeaks.params;
  }

  // RNA
  if (cfg.rna_tracks && cfg.rna_tracks.RNAseq) {
    if (cfg.rna_tracks.RNAseq.strandedness) configState.rna_strandedness = cfg.rna_tracks.RNAseq.strandedness;
    if (cfg.rna_tracks.RNAseq.multimap) configState.rna_multimap = cfg.rna_tracks.RNAseq.multimap;
  }

  // Import genome sections
  configState.genomes = {};

  function importGenomeBlock(key, val) {
    if (definedGenomes.indexOf(key) < 0) definedGenomes.push(key);
    configState.genomes[key] = {
      genus: val.genus || "",
      species: val.species || "",
      fasta_file: val.fasta_file || "",
      gff_file: val.gff_file || "",
      gtf_file: val.gtf_file || "",
      gaf_file: val.gaf_file || "",
      gene_info_file: val.gene_info_file || "",
      te_file: val.te_file || "",
      structural_rna_fafile: val.structural_rna_fafile || "",
      star_index: val.star_index || "",
      genomesize: String(val.genomesize || ""),
      ncbi_taxid: val.ncbi_taxid ? String(val.ncbi_taxid) : (val.ncbiID ? String(val.ncbiID) : "")
    };
  }

  if (cfg.genomes && typeof cfg.genomes === "object") {
    // New format: genomes are under the genomes: key
    for (var gn in cfg.genomes) {
      importGenomeBlock(gn, cfg.genomes[gn]);
    }
  } else {
    // Old format fallback: detect bare genome keys + separate species blocks
    var oldSpecies = {};
    var knownKeys = new Set(["repo_folder","analysis_name","sample_file","full_analysis","te_analysis",
      "QC_option","GO","trimmed_fastqs","aligned_bams",
      "keep_intermediates","keep_trimmed_fastqs","keep_final_bams","keep_merged_bams",
      "keep_shifted_bams","keep_cx_reports","keep_dmc_intermediates","motifs","jaspar_db","motifs_allreps",
      "quality_threshold","min_read_length","trim_front","adapter1","adapter2",
      "chip_fingerprint_plots","fingerprint_samples",
      "chip_aligner","atac_aligner","chip_mapping_strategy","atac_mapping_strategy",
      "chip_mapping_option","atac_mapping_option",
      "bt2_mapping_strategy","chip_tracks","atac_tracks","chip_callpeaks","atac_callpeaks",
      "rampage_calltss","diffpeaks_params","upset_allreps","rna_tracks","mC_context","pca_bs",
      "pca_step","mC_mapping","custom_script_dmrs","dmc_methylation","dmc_dmr_method",
      "nextflex_v3_deduplication","structural_rna_depletion","infernal_threshold","srna_mapping_params",
      "srna_min_size","srna_max_size","srna_heatmap_sizes","plot_allreps","heatmaps_scales",
      "stranded_heatmaps","heatmaps_sort_options","heatmap_sort_mc_after_others",
      "profiles_scale","profiles_plot_params","heatmaps_plot_params","heatmaps",
      "heat_mcg","heat_mchg","heat_mchh","browser_TE_file","browser_scales",
      "chromosome_bs","fixed_mc_scales","fixed_mcg","fixed_mchg","fixed_mchh",
      "motif_target_file_label","motif_target_file","motif_ref_genome",
      "rnaseq_target_file_label","rnaseq_target_file","rnaseq_background_file",
      "srna_target_file_label","srna_target_file","heatmap_target_file_label",
      "heatmap_target_file","browser_target_file_label","browser_target_file",
      "low_resources","standard_resources","heavy_resources","heavier_resources",
      "max_resources","single_thread","resources"]);

    // First pass: collect species blocks
    for (var key in cfg) {
      if (knownKeys.has(key)) continue;
      var val = cfg[key];
      if (val && typeof val === "object" && !Array.isArray(val)) {
        if (!val.fasta_file && !val.species && !val.gff_file && (val.star_index != null || val.genomesize != null)) {
          oldSpecies[key] = val;
        }
      }
    }

    // Second pass: import genome blocks, merging species params
    for (var key in cfg) {
      if (knownKeys.has(key)) continue;
      var val = cfg[key];
      if (val && typeof val === "object" && !Array.isArray(val)) {
        if (val.fasta_file || val.species || val.gff_file) {
          var merged = {};
          // Inline species params if species block exists
          var spName = val.species;
          if (spName && oldSpecies[spName]) {
            for (var sk in oldSpecies[spName]) merged[sk] = oldSpecies[spName][sk];
          }
          for (var gk in val) merged[gk] = val[gk];
          importGenomeBlock(key, merged);
        }
      }
    }
  }

  // Rebuild the form
  buildConfigForm();
}

// Config toolbar event handlers
document.getElementById("import-yaml").addEventListener("change", function(e) {
  readFileAsText(e.target, handleYAMLImport);
});
document.getElementById("btn-export-yaml").addEventListener("click", exportYAML);

// ===========================================================================
// Section switching (navigation)
// ===========================================================================

function switchSection(sectionId) {
  // Toggle section divs
  var sections = document.querySelectorAll(".section");
  for (var i = 0; i < sections.length; i++) {
    sections[i].classList.toggle("active", sections[i].id === sectionId);
  }
  // Toggle nav tab highlights
  var tabs = document.querySelectorAll(".topnav .nav-tab");
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.toggle("active", tabs[i].getAttribute("data-section") === sectionId);
  }
  // Tabulator needs a redraw when its container becomes visible again
  if (sectionId === "samplesheet-section") {
    table.redraw(true);
  }
  // Rebuild genomes tab when switching to it
  if (sectionId === "genomes-section") {
    buildGenomesTab();
  }
  // Rebuild dynamic config sections when switching to config
  if (sectionId === "config-section") {
    updateConfigDynamicSections();
  }
}
