<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPICC Sample Sheet Builder</title>
<link href="https://unpkg.com/tabulator-tables@6/dist/css/tabulator_midnight.min.css" rel="stylesheet">
<script src="https://unpkg.com/tabulator-tables@6/dist/js/tabulator.min.js"></script>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #e94560;
    --accent2: #53a8b6;
    --text: #eee;
    --text-dim: #999;
    --err: #e94560;
    --warn: #f0a500;
    --ok: #53a8b6;
    --border: #2a2a4a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    white-space: nowrap;
  }
  header h1 span { color: var(--accent); }
  .toolbar {
    display: flex;
    gap: 8px;
    margin-left: auto;
    align-items: center;
    flex-wrap: wrap;
  }
  .toolbar button, .toolbar label {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .toolbar button:hover, .toolbar label:hover { background: var(--accent); }
  .toolbar button:disabled { opacity: 0.35; cursor: default; pointer-events: none; }
  .toolbar .btn-accent { background: var(--accent); color: #fff; }
  .toolbar .btn-accent:hover { background: #c73a52; }
  .toolbar input[type="file"] { display: none; }
  main {
    display: flex;
    flex-direction: column;
    flex: 1;
    overflow: hidden;
  }
  #description-panel {
    padding: 8px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-dim);
    min-height: 32px;
    flex-shrink: 0;
  }
  #description-panel strong { color: var(--accent2); margin-right: 6px; }
  #table-container {
    flex: 1;
    overflow: auto;
    padding: 0;
  }
  #diagnostics-panel {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 8px 20px;
    max-height: 180px;
    overflow-y: auto;
    flex-shrink: 0;
    font-size: 12px;
    font-family: "SF Mono", "Fira Code", "Consolas", monospace;
  }
  #diagnostics-panel:empty::before {
    content: "No validation issues";
    color: var(--ok);
  }
  .diag-error { color: var(--err); }
  .diag-warning { color: var(--warn); }
  .diag-ok { color: var(--ok); }
  .diag-summary { margin-bottom: 4px; font-weight: 600; }

  /* Tabulator overrides */
  .tabulator {
    background: var(--bg);
    border: none;
    font-size: 13px;
  }
  .tabulator .tabulator-header {
    background: var(--surface);
    border-bottom: 2px solid var(--accent);
  }
  .tabulator .tabulator-header .tabulator-col {
    background: var(--surface);
    border-right: 1px solid var(--border);
  }
  .tabulator .tabulator-header .tabulator-col .tabulator-col-title {
    color: var(--text);
    font-weight: 600;
  }
  .tabulator .tabulator-tableholder .tabulator-table .tabulator-row {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .tabulator .tabulator-tableholder .tabulator-table .tabulator-row:hover {
    background: var(--surface);
  }
  .tabulator .tabulator-row .tabulator-cell {
    border: none !important;
    border-right: 1px solid var(--border) !important;
    color: var(--text);
    padding: 4px 8px;
  }
  .tabulator .tabulator-row .tabulator-cell.tabulator-editing {
    border: 1px solid var(--accent2) !important;
    padding: 0;
  }
  .tabulator .tabulator-row .tabulator-cell.tabulator-editing input,
  .tabulator .tabulator-row .tabulator-cell.tabulator-editing select {
    background: var(--surface);
    color: var(--text);
    border: none;
    padding: 4px 8px;
    font-size: 13px;
  }
  .tabulator .tabulator-footer { background: var(--surface); }

  /* Validation indicators */
  .cell-error {
    border-left: 3px solid var(--err) !important;
  }
  .cell-warning {
    border-left: 3px solid var(--warn) !important;
  }

  /* Selected row highlight */
  .tabulator-row.tabulator-selected { background: var(--surface2) !important; }
  .tabulator-row.tabulator-selected:hover { background: #1a4a70 !important; }

  /* Placeholder styling for suggested Sample_ID */
  .cell-suggestion {
    color: var(--text-dim) !important;
    font-style: italic;
  }

  /* Example cell — dimmed until user edits it */
  .tabulator-row .tabulator-cell.cell-example {
    color: var(--text-dim) !important;
    font-style: italic;
  }

  /* Action column */
  .row-action-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 18px;
    padding: 0 4px;
    line-height: 1;
  }
  .row-action-btn:hover { color: var(--accent); }

  /* Context menu */
  .ctx-menu {
    position: fixed;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    z-index: 10000;
    min-width: 180px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    padding: 4px 0;
  }
  .ctx-menu div {
    padding: 8px 16px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
  }
  .ctx-menu div:hover {
    background: var(--surface2);
    color: var(--accent);
  }
  .ctx-menu-sep {
    border-top: 1px solid var(--border);
    margin: 4px 0;
    padding: 0 !important;
    cursor: default !important;
  }
  .ctx-menu-sep:hover {
    background: transparent !important;
    color: inherit !important;
  }

  /* Tabulator list editor dropdown styling */
  .tabulator-edit-list {
    background: var(--surface) !important;
    border: 1px solid var(--border) !important;
    color: var(--text) !important;
  }
  .tabulator-edit-list .tabulator-edit-list-item {
    color: var(--text) !important;
  }
  .tabulator-edit-list .tabulator-edit-list-item:hover {
    background: var(--surface2) !important;
    color: var(--accent) !important;
  }
  .tabulator-edit-list .tabulator-edit-list-item.active {
    background: var(--accent) !important;
    color: white !important;
  }
</style>
</head>
<body>

<header>
  <h1><span>EPICC</span> Sample Sheet Builder</h1>
  <div class="toolbar">
    <button id="btn-add-row" aria-label="Add a new empty row">+ Add Row</button>
    <button id="btn-dup-selected" aria-label="Duplicate selected rows" disabled>Duplicate Selected</button>
    <button id="btn-del-selected" aria-label="Delete selected rows" disabled>Delete Selected</button>
    <label for="import-file" class="btn-accent" role="button" aria-label="Import TSV file" tabindex="0"
           onkeydown="if(event.key==='Enter')this.click()">Import TSV
      <input type="file" id="import-file" accept=".tsv,.txt,.tab" aria-label="Choose TSV file to import">
    </label>
    <button id="btn-export" class="btn-accent" aria-label="Export sample sheet as TSV">Export TSV</button>
  </div>
</header>

<main>
  <div id="description-panel" aria-live="polite" role="status">
    Click a column header or cell to see its description.
  </div>
  <div id="table-container"></div>
  <div id="diagnostics-panel" aria-live="polite" role="log" aria-label="Validation diagnostics"></div>
</main>

<script>
// ===========================================================================
// Constants (mirroring workflow/scripts/sample_sheet.py & samplefile_validation.py)
// ===========================================================================

const COLUMNS = [
  "Sample_ID", "Assay", "Genome", "Levels", "Replicate_ID",
  "Read_files", "Read_layout", "IP_target", "Control"
];

const VALID_ASSAYS = [
  "ChIP_broad", "ChIP_narrow", "ATAC",
  "RNAseq", "RAMPAGE",
  "sRNA",
  "WGBS", "EMseq", "dmC"
];

const ASSAY_TO_ENV = {
  ChIP_broad: "ChIP", ChIP_narrow: "ChIP",
  ATAC: "ATAC",
  RNAseq: "RNA", RAMPAGE: "RNA",
  sRNA: "sRNA",
  WGBS: "mC", EMseq: "mC", dmC: "mC"
};

const VALID_ASSAYS_SET = new Set(VALID_ASSAYS);
const CHIP_ASSAYS = new Set(["ChIP_broad", "ChIP_narrow"]);
const CONTROL_ASSAYS = new Set(["ChIP_broad", "ChIP_narrow", "RAMPAGE"]);

// Which assays can provide a control for each control-bearing assay
const CONTROL_SOURCE_ASSAYS = {
  ChIP_broad:  CHIP_ASSAYS,
  ChIP_narrow: CHIP_ASSAYS,
  RAMPAGE:     new Set(["RNAseq"]),
};

// Known marks and recommended assay type (derived from config/config.yaml peaktype)
const KNOWN_MARKS = [
  { pattern: /^(H3K27me[123]|H3K9me[123]|H4K20me[123]|H3K36me3|H3\.3|H3\.1|MGH3|CenH3|.*DDM1|PolIIS2P|H2AT120Ph|H2AKub)$/i, assay: "ChIP_broad" },
  { pattern: /^(H3K27ac|H3K4me3|H3K9ac|H4K16ac|H3K23ac|MNase)$/i, assay: "ChIP_narrow" },
  { pattern: /^(H3|H4)$/i, assay: "ChIP_broad" },
];

function getRecommendedAssay(ipTarget) {
  for (var i = 0; i < KNOWN_MARKS.length; i++) {
    if (KNOWN_MARKS[i].pattern.test(ipTarget)) return KNOWN_MARKS[i].assay;
  }
  return null;
}

const UNSAFE_CHARS_RE = /[/\\\s'";&|<>$`!{}()\[\]?*~#]/;
const DOUBLE_UNDERSCORE_RE = /__/;
const SRA_REGEX = /^[SDE]RR\d+$/;

const COLUMN_DESCRIPTIONS = {
  Sample_ID: "Unique identifier for each sample row. Used as a filesystem path component. Must not contain '__' or unsafe characters (/ \\ whitespace '\";&|<>$`!{}()[]?*~#). Concise descriptive IDs like 'WT_leaf_H3K9me2_rep1' are recommended.",
  Assay: "Experimental assay type. Determines pipeline routing: ChIP_broad (histone marks), ChIP_narrow (TFs, H3K4me3), ATAC, RNAseq, RAMPAGE, sRNA, WGBS, EMseq, dmC.",
  Genome: "Reference genome name (e.g. Spombe, ColCEN, hg38). Used to locate genome files under genomes/{Genome}/.",
  Levels: "Comma-separated factor:level pairs (e.g. genotype:WT,tissue:root). All rows must have the same factors. Level values form the 'levels_label' in analysis names.",
  Replicate_ID: "Replicate identifier (e.g. rep1, rep2). Replicates are mapped independently then merged for downstream analysis.",
  Read_files: "SRA accession (SRR12345678), local path, or '+'-separated for merging. PE local: comma-separated R1,R2 pair.",
  Read_layout: "Sequencing layout: SE (single-end) or PE (paired-end).",
  IP_target: "What was immunoprecipitated. Required for ChIP assays (e.g. H3K9me2, Input). Must be blank for non-ChIP assays.",
  Control: "Sample_ID of the control sample (e.g. Input for ChIP). Only for ChIP_broad, ChIP_narrow, RAMPAGE. No chaining allowed."
};

// Assay short names for Sample_ID suggestion (non-ChIP assays)
const ASSAY_SHORT = {
  ATAC: "ATAC", RNAseq: "RNA", RAMPAGE: "RAMPAGE",
  sRNA: "sRNA", WGBS: "WGBS", EMseq: "EMseq", dmC: "dmC"
};

// ===========================================================================
// State
// ===========================================================================

let table;
let cellIssues = {}; // { "rowId:field": { errors: [], warnings: [] } }
let activeCtxMenu = null;

// ===========================================================================
// Helpers
// ===========================================================================

function parseLevels(str) {
  if (!str) return null;
  const pairs = str.split(",").map(s => s.trim());
  const result = [];
  for (const p of pairs) {
    if (!p.includes(":")) return null;
    const [factor, ...rest] = p.split(":");
    result.push({ factor: factor.trim(), level: rest.join(":").trim() });
  }
  return result;
}

function levelsToLabel(str) {
  const parsed = parseLevels(str);
  if (!parsed) return "";
  return parsed.map(p => p.level).join("_");
}

function suggestSampleId(rowData) {
  const assay = (rowData.Assay || "").trim();
  const levels = (rowData.Levels || "").trim();
  const rep = (rowData.Replicate_ID || "").trim();
  const ip = (rowData.IP_target || "").trim();
  if (!levels || !rep) return "";
  const label = levelsToLabel(levels);
  if (!label) return "";
  if (CHIP_ASSAYS.has(assay)) {
    if (!ip) return "";
    return label + "_" + ip + "_" + rep;
  }
  const short = ASSAY_SHORT[assay];
  if (!short) return "";
  return label + "_" + short + "_" + rep;
}

function emptyRow() {
  return {
    Sample_ID: "", Assay: "", Genome: "", Levels: "", Replicate_ID: "",
    Read_files: "", Read_layout: "", IP_target: "", Control: ""
  };
}

// ===========================================================================
// Description panel (safe DOM methods only)
// ===========================================================================

const descPanel = document.getElementById("description-panel");
function showDescription(field) {
  const desc = COLUMN_DESCRIPTIONS[field];
  if (desc) {
    // Clear and rebuild with safe DOM methods
    while (descPanel.firstChild) descPanel.removeChild(descPanel.firstChild);
    const strong = document.createElement("strong");
    strong.textContent = field;
    descPanel.appendChild(strong);
    descPanel.appendChild(document.createTextNode(" " + desc));
  }
}

function refreshUI() {
  runValidation();
  applySuggestions();
  applyExampleCellStyles();
}

function clearSuggestion(el) {
  el.classList.remove("cell-suggestion");
  el.removeAttribute("data-suggestion");
  el.title = "";
}

function descHooks(field) {
  return {
    headerClick: function() { showDescription(field); },
    cellClick: function(e, cell) { showDescription(field); },
  };
}

// ===========================================================================
// Context menu
// ===========================================================================

function closeCtxMenu() {
  if (activeCtxMenu) {
    activeCtxMenu.remove();
    activeCtxMenu = null;
  }
}
document.addEventListener("click", closeCtxMenu);
document.addEventListener("keydown", function(e) { if (e.key === "Escape") closeCtxMenu(); });

function showCtxMenu(e, row) {
  closeCtxMenu();
  const menu = document.createElement("div");
  menu.className = "ctx-menu";
  menu.setAttribute("role", "menu");

  const items = [
    { label: "Add replicate", action: function() { addReplicate(row); } },
    { label: "Duplicate row", action: function() { duplicateRow(row); } },
    { sep: true },
    { label: "Move up", action: function() { moveRow(row, -1); } },
    { label: "Move down", action: function() { moveRow(row, 1); } },
    { sep: true },
    { label: "Remove row", action: function() { removeRow(row); } },
  ];

  for (var ii = 0; ii < items.length; ii++) {
    var item = items[ii];
    if (item.sep) {
      var sep = document.createElement("div");
      sep.className = "ctx-menu-sep";
      menu.appendChild(sep);
      continue;
    }
    var el = document.createElement("div");
    el.textContent = item.label;
    el.setAttribute("role", "menuitem");
    el.setAttribute("tabindex", "0");
    (function(action) {
      el.addEventListener("click", function(ev) { ev.stopPropagation(); closeCtxMenu(); action(); });
      el.addEventListener("keydown", function(ev) { if (ev.key === "Enter") { ev.stopPropagation(); closeCtxMenu(); action(); } });
    })(item.action);
    menu.appendChild(el);
  }

  // Position
  var x = (e.clientX || e.pageX || 100);
  var y = (e.clientY || e.pageY || 100);
  menu.style.left = x + "px";
  menu.style.top = y + "px";
  document.body.appendChild(menu);

  // Adjust if offscreen
  var rect = menu.getBoundingClientRect();
  if (rect.right > window.innerWidth) menu.style.left = (window.innerWidth - rect.width - 8) + "px";
  if (rect.bottom > window.innerHeight) menu.style.top = (window.innerHeight - rect.height - 8) + "px";

  activeCtxMenu = menu;
}

// ===========================================================================
// Row actions
// ===========================================================================

function addReplicate(row) {
  var data = Object.assign({}, row.getData());
  // Increment replicate
  var rep = data.Replicate_ID || "";
  var m = rep.match(/^(.*?)(\d+)$/);
  if (m) {
    data.Replicate_ID = m[1] + (parseInt(m[2]) + 1);
  } else {
    data.Replicate_ID = rep ? rep + "_2" : "rep1";
  }
  data.Sample_ID = ""; // clear so suggestion kicks in
  delete data.id; // new internal id
  table.addRow(data, false, row);
  refreshUI();
}

function duplicateRow(row) {
  var data = Object.assign({}, row.getData());
  data.Sample_ID = data.Sample_ID ? data.Sample_ID + "_copy" : "";
  delete data.id;
  table.addRow(data, false, row);
  refreshUI();
}

function moveRow(row, direction) {
  var rows = table.getRows();
  var idx = rows.indexOf(row);
  var targetIdx = idx + direction;
  if (targetIdx < 0 || targetIdx >= rows.length) return;
  if (direction < 0) {
    row.move(rows[targetIdx], true);
  } else {
    row.move(rows[targetIdx], false);
  }
}

function removeRow(row) {
  row.delete();
  refreshUI();
}

// ===========================================================================
// Validation Engine
// ===========================================================================

function runValidation() {
  cellIssues = {};
  var data = table.getData();
  var errors = [];
  var warnings = [];
  var sampleIds = new Set();
  var rows = table.getRows();

  // --- Per-row validation (skip example rows) ---
  for (var i = 0; i < data.length; i++) {
    if (data[i]._example) continue;
    var row = data[i];
    var rowNum = i + 1;
    var sid = (row.Sample_ID || "").trim();
    var assay = (row.Assay || "").trim();
    var genome = (row.Genome || "").trim();
    var levels = (row.Levels || "").trim();
    var rep = (row.Replicate_ID || "").trim();
    var readFiles = (row.Read_files || "").trim();
    var readLayout = (row.Read_layout || "").trim();
    var ipTarget = (row.IP_target || "").trim();
    var control = (row.Control || "").trim();
    var rowKey = rows[i] ? rows[i].getIndex() : i;

    // Sample_ID
    if (!sid) {
      addIssue(cellIssues, errors, rowKey, "Sample_ID", "[X] Row #" + rowNum + ": Sample_ID is required");
    } else {
      if (UNSAFE_CHARS_RE.test(sid))
        addIssue(cellIssues, errors, rowKey, "Sample_ID", "[X] Row #" + rowNum + " '" + sid + "': Sample_ID contains unsafe characters");
      if (DOUBLE_UNDERSCORE_RE.test(sid))
        addIssue(cellIssues, errors, rowKey, "Sample_ID", "[X] Row #" + rowNum + " '" + sid + "': Sample_ID must not contain '__'");
      if (sampleIds.has(sid))
        addIssue(cellIssues, errors, rowKey, "Sample_ID", "[X] Row #" + rowNum + " '" + sid + "': duplicate Sample_ID");
      sampleIds.add(sid);
    }

    // Assay
    if (!VALID_ASSAYS_SET.has(assay))
      addIssue(cellIssues, errors, rowKey, "Assay", "[X] Row #" + rowNum + " '" + sid + "': Assay '" + assay + "' not in [" + VALID_ASSAYS.join(", ") + "]");

    // Genome
    if (!genome)
      addIssue(cellIssues, errors, rowKey, "Genome", "[X] Row #" + rowNum + " '" + sid + "': Genome is required");

    // Levels
    if (!levels) {
      addIssue(cellIssues, errors, rowKey, "Levels", "[X] Row #" + rowNum + " '" + sid + "': Levels is required");
    } else {
      var pairs = levels.split(",");
      for (var pi = 0; pi < pairs.length; pi++) {
        var p = pairs[pi].trim();
        if (!p.includes(":")) {
          addIssue(cellIssues, errors, rowKey, "Levels", "[X] Row #" + rowNum + " '" + sid + "': Levels entry '" + p + "' must be 'factor:level' format");
        } else {
          var parts = p.split(":");
          var factor = parts[0];
          var level = parts.slice(1).join(":");
          if (!factor.trim() || !level.trim())
            addIssue(cellIssues, errors, rowKey, "Levels", "[X] Row #" + rowNum + " '" + sid + "': empty factor name or level in Levels");
        }
      }
    }

    // Replicate_ID
    if (!rep)
      addIssue(cellIssues, errors, rowKey, "Replicate_ID", "[X] Row #" + rowNum + " '" + sid + "': Replicate_ID is required");

    // Read_layout
    if (readLayout !== "SE" && readLayout !== "PE")
      addIssue(cellIssues, errors, rowKey, "Read_layout", "[X] Row #" + rowNum + " '" + sid + "': Read_layout must be 'SE' or 'PE', got '" + readLayout + "'");

    // Read_files
    if (!readFiles) {
      addIssue(cellIssues, errors, rowKey, "Read_files", "[X] Row #" + rowNum + " '" + sid + "': Read_files is required");
    } else {
      var components = readFiles.split("+").map(function(s) { return s.trim(); });
      for (var ci = 0; ci < components.length; ci++) {
        var files = components[ci].split(",").map(function(s) { return s.trim(); });
        var first = files[0];
        if (SRA_REGEX.test(first)) {
          for (var fi = 0; fi < files.length; fi++) {
            if (!SRA_REGEX.test(files[fi]))
              addIssue(cellIssues, errors, rowKey, "Read_files", "[X] Row #" + rowNum + " '" + sid + "': mixed SRA/path in Read_files component");
          }
        } else {
          if (readLayout === "PE" && files.length === 1 && !first.endsWith(".bam"))
            addIssue(cellIssues, warnings, rowKey, "Read_files", "[!] Row #" + rowNum + " '" + sid + "': Read_layout is PE but Read_files has only one path (expected comma-separated pair)", "warnings");
          if (readLayout === "SE" && files.length > 1)
            addIssue(cellIssues, warnings, rowKey, "Read_files", "[!] Row #" + rowNum + " '" + sid + "': Read_layout is SE but Read_files has multiple comma-separated paths", "warnings");
        }
      }
    }

    // IP_target
    if (CHIP_ASSAYS.has(assay)) {
      if (!ipTarget) {
        addIssue(cellIssues, errors, rowKey, "IP_target", "[X] Row #" + rowNum + " '" + sid + "': IP_target is required for " + assay);
      } else {
        // Check known marks vs assay recommendation
        var recommended = getRecommendedAssay(ipTarget);
        if (recommended && recommended !== assay) {
          addIssue(cellIssues, warnings, rowKey, "IP_target",
            "[!] Row #" + rowNum + " '" + sid + "': IP_target '" + ipTarget + "' is typically called with " + recommended + ", but Assay is " + assay, "warnings");
        }
      }
    } else if (assay) {
      if (ipTarget)
        addIssue(cellIssues, errors, rowKey, "IP_target", "[X] Row #" + rowNum + " '" + sid + "': IP_target must be blank for " + assay);
    }

    // Control (assay check only - reference checks below)
    if (control) {
      if (!CONTROL_ASSAYS.has(assay))
        addIssue(cellIssues, errors, rowKey, "Control", "[X] Row #" + rowNum + " '" + sid + "': Control is not allowed for " + assay);
    }
  }

  // --- Cross-row validation ---

  // Levels: consistent factors (skip example rows)
  var allFactors = [];
  for (var i = 0; i < data.length; i++) {
    if (data[i]._example) { allFactors.push(null); continue; }
    var levels = (data[i].Levels || "").trim();
    if (!levels) { allFactors.push(null); continue; }
    var parsed = parseLevels(levels);
    allFactors.push(parsed ? parsed.map(function(p) { return p.factor; }) : null);
  }
  var refFactors = null;
  var refRowNum = 1;
  for (var i = 0; i < allFactors.length; i++) {
    if (allFactors[i] !== null) { refFactors = allFactors[i]; refRowNum = i + 1; break; }
  }
  if (refFactors) {
    for (var i = 0; i < allFactors.length; i++) {
      var factors = allFactors[i];
      if (factors === null) continue;
      if (i + 1 === refRowNum) continue; // skip the reference row itself
      var rowNum = i + 1;
      var rowKey = rows[i] ? rows[i].getIndex() : i;
      if (factors.length !== refFactors.length) {
        addIssue(cellIssues, errors, rowKey, "Levels",
          "[X] Row #" + rowNum + ": Levels has " + factors.length + " factors, expected " + refFactors.length + " (matching row " + refRowNum + ")");
      } else if (factors.join("\0") !== refFactors.join("\0")) {
        addIssue(cellIssues, errors, rowKey, "Levels",
          "[X] Row #" + rowNum + ": Levels factor names [" + factors.join(",") + "] don't match row " + refRowNum + " [" + refFactors.join(",") + "]");
      }
    }
  }

  // Control: reference validation (skip example rows)
  // Build O(1) lookup from Sample_ID → row data (sampleIds Set already complete from per-row loop)
  var sidToRow = new Map();
  for (var i = 0; i < data.length; i++) {
    var s = (data[i].Sample_ID || "").trim();
    if (s) sidToRow.set(s, data[i]);
  }
  for (var i = 0; i < data.length; i++) {
    if (data[i]._example) continue;
    var control = (data[i].Control || "").trim();
    var sid = (data[i].Sample_ID || "").trim();
    var rowNum = i + 1;
    var rowKey = rows[i] ? rows[i].getIndex() : i;
    if (!control) continue;

    if (!sampleIds.has(control)) {
      addIssue(cellIssues, errors, rowKey, "Control",
        "[X] Row #" + rowNum + " '" + sid + "': Control '" + control + "' does not match any Sample_ID in the sheet");
    } else {
      // No chaining
      var ctrlRow = sidToRow.get(control);
      if (ctrlRow) {
        var ctrlCtrl = (ctrlRow.Control || "").trim();
        if (ctrlCtrl) {
          addIssue(cellIssues, errors, rowKey, "Control",
            "[X] Row #" + rowNum + " '" + sid + "': Control '" + control + "' itself has a Control (chaining not allowed)");
        }
      }
    }
  }

  // --- Update UI ---
  updateCellStyles();
  renderDiagnostics(errors, warnings);
}

function addIssue(issues, list, rowKey, field, msg, severity) {
  list.push(msg);
  var key = rowKey + ":" + field;
  if (!issues[key]) issues[key] = { errors: [], warnings: [] };
  issues[key][severity || "errors"].push(msg);
}

function updateCellStyles() {
  var rows = table.getRows();
  for (var ri = 0; ri < rows.length; ri++) {
    var rowKey = rows[ri].getIndex();
    for (var ci = 0; ci < COLUMNS.length; ci++) {
      var field = COLUMNS[ci];
      var cell = rows[ri].getCell(field);
      if (!cell) continue;
      var el = cell.getElement();
      el.classList.remove("cell-error", "cell-warning");
      var key = rowKey + ":" + field;
      var issues = cellIssues[key];
      if (issues && issues.errors.length > 0) {
        el.classList.add("cell-error");
      } else if (issues && issues.warnings.length > 0) {
        el.classList.add("cell-warning");
      }
    }
  }
}

var _lastDiagKey = "";

function appendDiagSection(panel, items, cssClass, label) {
  if (items.length === 0) return;
  var summary = document.createElement("div");
  summary.className = "diag-summary " + cssClass;
  summary.textContent = items.length + " " + label + (items.length > 1 ? "s" : "");
  panel.appendChild(summary);
  for (var i = 0; i < items.length; i++) {
    var div = document.createElement("div");
    div.className = cssClass;
    div.textContent = items[i];
    panel.appendChild(div);
  }
}

function renderDiagnostics(errors, warnings) {
  // Skip DOM rebuild if content is unchanged — prevents focus theft
  var newKey = errors.join("\n") + "\n---\n" + warnings.join("\n");
  if (newKey === _lastDiagKey) return;
  _lastDiagKey = newKey;

  // Save and restore focus so panel rebuild doesn't steal it
  var focused = document.activeElement;

  var panel = document.getElementById("diagnostics-panel");
  while (panel.firstChild) panel.removeChild(panel.firstChild);

  if (errors.length === 0 && warnings.length === 0) {
    if (focused && focused !== document.body) focused.focus();
    return;
  }

  appendDiagSection(panel, errors,   "diag-error",   "error");
  appendDiagSection(panel, warnings, "diag-warning", "warning");

  // Restore focus if it was lost during rebuild
  if (focused && focused !== document.body && document.activeElement !== focused) {
    focused.focus();
  }
}

// ===========================================================================
// Sample_ID suggestion
// ===========================================================================

function applySuggestions() {
  var rows = table.getRows();
  for (var ri = 0; ri < rows.length; ri++) {
    var data = rows[ri].getData();
    var sid = (data.Sample_ID || "").trim();
    var cell = rows[ri].getCell("Sample_ID");
    if (!cell) continue;
    var el = cell.getElement();
    if (!sid) {
      var suggestion = suggestSampleId(data);
      if (suggestion) {
        el.classList.add("cell-suggestion");
        el.setAttribute("data-suggestion", suggestion);
        el.title = "Suggested: " + suggestion;
        // Show suggestion as cell content if not editing
        if (!el.querySelector(".tabulator-editing")) {
          el.textContent = suggestion;
        }
      } else {
        clearSuggestion(el);
      }
    } else {
      clearSuggestion(el);
    }
  }
}

// ===========================================================================
// Import / Export
// ===========================================================================

function importTSV(text) {
  var lines = text.split(/\r?\n/).filter(function(l) { return l.trim(); });
  if (lines.length < 1) return;

  var header = lines[0].split("\t").map(function(s) { return s.trim(); });
  // Validate header
  var missing = COLUMNS.filter(function(c) { return header.indexOf(c) === -1; });
  if (missing.length > 0) {
    alert("Import error: missing columns: " + missing.join(", ") +
      "\n\nExpected: " + COLUMNS.join(", ") +
      "\nFound: " + header.join(", "));
    return;
  }

  var colIdx = {};
  for (var ci = 0; ci < COLUMNS.length; ci++) {
    colIdx[COLUMNS[ci]] = header.indexOf(COLUMNS[ci]);
  }

  var rows = [];
  for (var i = 1; i < lines.length; i++) {
    var fields = lines[i].split("\t");
    var row = {};
    for (var ci = 0; ci < COLUMNS.length; ci++) {
      var c = COLUMNS[ci];
      row[c] = (fields[colIdx[c]] || "").trim();
    }
    rows.push(row);
  }

  table.setData(rows);
  setTimeout(function() { refreshUI(); }, 100);
}

function exportTSV() {
  var data = table.getData().filter(function(r) { return !r._example; });
  if (data.length === 0) { alert("No data to export (example rows are excluded)."); return; }
  // Before export, accept suggestions for empty Sample_IDs
  for (var i = 0; i < data.length; i++) {
    if (!(data[i].Sample_ID || "").trim()) {
      var suggestion = suggestSampleId(data[i]);
      if (suggestion) data[i].Sample_ID = suggestion;
    }
  }
  var lines = [COLUMNS.join("\t")];
  for (var i = 0; i < data.length; i++) {
    lines.push(COLUMNS.map(function(c) { var v = data[i][c]; return (v == null) ? "" : String(v); }).join("\t"));
  }
  var blob = new Blob([lines.join("\n") + "\n"], { type: "text/tab-separated-values" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "sample_sheet.tsv";
  a.click();
  setTimeout(function() { URL.revokeObjectURL(url); }, 200);
}

// ===========================================================================
// Tabulator initialization

// Build a filtered list of compatible Control candidates for a given row's Assay.
// ChIP_broad/ChIP_narrow: controls must be ChIP_broad or ChIP_narrow samples.
// RAMPAGE: controls must be RNAseq samples.
function controlListValues(cell) {
  var rowData = cell.getRow().getData();
  var assay = (rowData.Assay || "").trim();
  var currentSid = (rowData.Sample_ID || "").trim();
  var allData = table.getData();

  // Determine which assays are valid sources for controls
  var validSourceAssays = CONTROL_SOURCE_ASSAYS[assay];
  if (!validSourceAssays) {
    return [{ label: "(None available)", value: "", disabled: true }];
  }

  var candidates = [];
  for (var i = 0; i < allData.length; i++) {
    var sid = (allData[i].Sample_ID || "").trim();
    var sAssay = (allData[i].Assay || "").trim();
    if (!sid || sid === currentSid) continue;
    if (validSourceAssays.has(sAssay)) {
      candidates.push(sid);
    }
  }

  if (candidates.length === 0) {
    return [{ label: "(None available)", value: "", disabled: true }];
  }
  return [""].concat(candidates);
}

var columnDefs = [
  {
    formatter: "rowSelection", titleFormatter: "rowSelection",
    headerSort: false, width: 30, hozAlign: "center", resizable: false,
    cellClick: function(e, cell) { cell.getRow().toggleSelect(); },
  },
  {
    title: "", field: "_actions", width: 36, headerSort: false,

    formatter: function() {
      return '<button class="row-action-btn" aria-label="Row actions" title="Row actions">\u22EE</button>';
    },
    cellClick: function(e, cell) {
      showCtxMenu(e, cell.getRow());
    }
  },
  Object.assign({
    title: "Sample ID", field: "Sample_ID", editor: "input", width: 160,
    editorParams: { elementAttributes: { placeholder: "auto-suggested or type your own" } },
  }, descHooks("Sample_ID")),
  Object.assign({
    title: "Assay", field: "Assay", width: 140,
    editor: "list",
    editorParams: { values: VALID_ASSAYS, autocomplete: true, listOnEmpty: true, freetext: false },
  }, descHooks("Assay")),
  Object.assign({
    title: "Genome", field: "Genome", editor: "input", width: 120,
    editorParams: { elementAttributes: { placeholder: "e.g. Spombe, ColCEN, hg38" } },
  }, descHooks("Genome")),
  Object.assign({
    title: "Levels", field: "Levels", editor: "input", width: 220,
    editorParams: { elementAttributes: { placeholder: "e.g. genotype:WT,tissue:root" } },
  }, descHooks("Levels")),
  Object.assign({
    title: "Replicate ID", field: "Replicate_ID", editor: "input", width: 110,
    editorParams: { elementAttributes: { placeholder: "e.g. rep1" } },
  }, descHooks("Replicate_ID")),
  Object.assign({
    title: "Read files", field: "Read_files", editor: "input", width: 200,
    editorParams: { elementAttributes: { placeholder: "e.g. SRR12345678" } },
  }, descHooks("Read_files")),
  Object.assign({
    title: "Read layout", field: "Read_layout", width: 110,
    editor: "list",
    editorParams: { values: ["SE", "PE"], listOnEmpty: true, freetext: false },
  }, descHooks("Read_layout")),

    },

];

// Example rows — valid data shown dimmed per-row until that row is edited.
// The _example flag marks rows as examples; removed when the row is first edited.
var EXAMPLE_DATA = [
  { _example: true, Sample_ID: "WT_leaf_Input_rep1", Assay: "ChIP_broad", Genome: "ColCEN", Levels: "genotype:WT,tissue:leaf", Replicate_ID: "rep1", Read_files: "/path/to/fastqs/WT_Input_Rep1", Read_layout: "PE", IP_target: "Input", Control: "" },
  { _example: true, Sample_ID: "WT_leaf_Input_rep2", Assay: "ChIP_broad", Genome: "ColCEN", Levels: "genotype:WT,tissue:leaf", Replicate_ID: "rep2", Read_files: "/path/to/fastqs/WT_Input_Rep2", Read_layout: "PE", IP_target: "Input", Control: "" },
  { _example: true, Sample_ID: "rdr126ddm1_leaf_CenH3_rep1", Assay: "ChIP_broad", Genome: "ColCEN", Levels: "genotype:rdr126ddm1,tissue:leaf", Replicate_ID: "rep1", Read_files: "/path/to/fastqs/ddm1rdr126_CenH3_IP_Rep1", Read_layout: "PE", IP_target: "CenH3", Control: "rdr126ddm1_leaf_Input_rep1" },
  { _example: true, Sample_ID: "ddm1_leaf_ATAC_Rep1", Assay: "ATAC", Genome: "ColCEN", Levels: "genotype:ddm1,tissue:leaf", Replicate_ID: "Rep1", Read_files: "SRR12362026", Read_layout: "PE", IP_target: "", Control: "" },
  { _example: true, Sample_ID: "ddm1_leaf_ATAC_Rep2", Assay: "ATAC", Genome: "ColCEN", Levels: "genotype:ddm1,tissue:leaf", Replicate_ID: "Rep2", Read_files: "SRR12362027", Read_layout: "PE", IP_target: "", Control: "" },
];

// Per-cell example tracking: stash for restoring on edit cancel
var _editingExampleStash = null; // { field, value } while an example cell is being edited

function applyExampleCellStyles() {
  var rows = table.getRows();
  for (var ri = 0; ri < rows.length; ri++) {
    var data = rows[ri].getData();
    var exData = data._exampleData;
    for (var ci = 0; ci < COLUMNS.length; ci++) {
      var cell = rows[ri].getCell(COLUMNS[ci]);
      if (!cell) continue;
      var el = cell.getElement();
      if (exData && COLUMNS[ci] in exData) {
        el.classList.add("cell-example");
      } else {
        el.classList.remove("cell-example");
      }
    }
  }
}

function hasAnyExampleRows() {
  var data = table.getData();
  for (var i = 0; i < data.length; i++) {
    if (data[i]._example) return true;
  }
  return false;
}

// Editable column fields in Tab order (excludes _actions)
var EDIT_FIELDS = COLUMNS.slice(); // ["Sample_ID", "Assay", ..., "Control"]

table = new Tabulator("#table-container", {
  data: EXAMPLE_DATA,
  columns: columnDefs,
  layout: "fitDataFill",
  selectableRows: true,
  movableRows: true,
  history: true,
  placeholder: "No data \u2014 click '+ Add Row' or import a TSV file",
  rowHeight: 32,
  index: "id",
  reactiveData: false,
  // Keep Tab within the table: wrap from last cell to next row, last row to first
  navigatorNextCell: function(cell, direction) {
    var row = cell.getRow();
    var field = cell.getField();
    var idx = EDIT_FIELDS.indexOf(field);
    if (idx < EDIT_FIELDS.length - 1) {
      // Move to next column in same row
      return row.getCell(EDIT_FIELDS[idx + 1]);
    }
    // End of row — move to first column of next row
    var rows = table.getRows();
    var rowIdx = rows.indexOf(row);
    if (rowIdx < rows.length - 1) {
      return rows[rowIdx + 1].getCell(EDIT_FIELDS[0]);
    }
    // Last cell of last row — wrap to first cell of first row
    return rows[0].getCell(EDIT_FIELDS[0]);
  },
  navigatorPrevCell: function(cell, direction) {
    var row = cell.getRow();
    var field = cell.getField();
    var idx = EDIT_FIELDS.indexOf(field);
    if (idx > 0) {
      // Move to previous column in same row
      return row.getCell(EDIT_FIELDS[idx - 1]);
    }
    // Start of row — move to last column of previous row
    var rows = table.getRows();
    var rowIdx = rows.indexOf(row);
    if (rowIdx > 0) {
      return rows[rowIdx - 1].getCell(EDIT_FIELDS[EDIT_FIELDS.length - 1]);
    }
    // First cell of first row — wrap to last cell of last row
    return rows[rows.length - 1].getCell(EDIT_FIELDS[EDIT_FIELDS.length - 1]);
  },
});

// Auto-increment IDs for row indexing
var _rowIdCounter = 0;
table.on("dataLoaded", function(data) {
  for (var i = 0; i < data.length; i++) {
    if (!data[i].id) data[i].id = ++_rowIdCounter;
    // Build per-cell example data map for example rows
    if (data[i]._example && !data[i]._exampleData) {
      var exData = {};
      for (var j = 0; j < COLUMNS.length; j++) {
        exData[COLUMNS[j]] = data[i][COLUMNS[j]] || "";
      }
      data[i]._exampleData = exData;
    }
  }
});
table.on("rowAdded", function(row) {
  var d = row.getData();
  if (!d.id) {
    row.update({ id: ++_rowIdCounter });
  }
});

// --- Editing-aware validation scheduling ---
// Validation modifies DOM (cell classes, diagnostics panel) which steals focus
// from Tabulator editors. We track editing state and only run validation when
// no cell editor is open.
var _editingActive = false;
var _validationDirty = false;

function scheduleValidation() {
  _validationDirty = true;
  // Check after a tick whether editing has stopped
  setTimeout(function() {
    if (!_editingActive && _validationDirty) {
      _validationDirty = false;
      refreshUI();
    }
  }, 20);
}

function flushValidationIfIdle() {
  if (!_editingActive && _validationDirty) {
    _validationDirty = false;
    refreshUI();
  }
}

// Per-cell example editing: let editor open with example text (user types over it).
// cellEdited fires only when the value actually changes; cellEditCancelled fires
// when the user presses Escape or commits without changing the value.
table.on("cellEditing", function(cell) {
  _editingActive = true;
  var row = cell.getRow();
  var data = row.getData();
  var field = cell.getField();

  if (data._exampleData && field in data._exampleData) {
    // Stash that this is an example cell; remove dimmed styling while editing
    _editingExampleStash = { field: field };
    cell.getElement().classList.remove("cell-example");
    // Select all text so typing immediately replaces the example value
    setTimeout(function() {
      var input = cell.getElement().querySelector("input");
      if (input) input.select();
    }, 0);
  } else {
    _editingExampleStash = null;
    // For real rows, accept Sample_ID suggestions
    if (field === "Sample_ID") {
      var val = (cell.getValue() || "").trim();
      var el = cell.getElement();
      var suggestion = el.getAttribute("data-suggestion");
      if (!val && suggestion) {
        cell.setValue(suggestion);
      }
    }
  }
});

table.on("cellEdited", function(cell) {
  _editingActive = false;
  var row = cell.getRow();
  var data = row.getData();
  var field = cell.getField();

  // User committed a real change on an example cell — mark this field as edited
  if (data._exampleData && field in data._exampleData) {
    delete data._exampleData[field];
    // Enable validation by clearing _example on first real edit
    if (data._example) {
      data._example = false;
    }
  }
  _editingExampleStash = null;

  // When Assay changes, clear IP_target for non-ChIP
  if (field === "Assay") {
    var assay = (cell.getValue() || "").trim();
    if (!CHIP_ASSAYS.has(assay)) {
      row.update({ IP_target: "" });
    }
  }
  scheduleValidation();
});

table.on("cellEditCancelled", function(cell) {
  _editingActive = false;
  // Restore example styling — value was never changed so no need to restore it
  if (_editingExampleStash && _editingExampleStash.field === cell.getField()) {
    cell.getElement().classList.add("cell-example");
  }
  _editingExampleStash = null;
  flushValidationIfIdle();
});

table.on("rowDeleted", function() { scheduleValidation(); });
table.on("rowMoved", function() { scheduleValidation(); });
table.on("rowSelectionChanged", function(rows) {
  var hasSelection = rows.length > 0;
  document.getElementById("btn-dup-selected").disabled = !hasSelection;
  document.getElementById("btn-del-selected").disabled = !hasSelection;
});

// Initial state
table.on("tableBuilt", function() {
  applyExampleCellStyles();
  // Only run validation on non-example data
  if (!hasAnyExampleRows()) {
    refreshUI();
  }
});

// ===========================================================================
// Toolbar event handlers
// ===========================================================================

document.getElementById("btn-add-row").addEventListener("click", function() {
  table.addRow(emptyRow());
  refreshUI();
});

document.getElementById("import-file").addEventListener("change", function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    importTSV(ev.target.result);
  };
  reader.readAsText(file);
  e.target.value = ""; // reset so same file can be re-imported
});

document.getElementById("btn-export").addEventListener("click", exportTSV);

document.getElementById("btn-del-selected").addEventListener("click", function() {
  var selected = table.getSelectedRows();
  if (selected.length === 0) return;
  selected.forEach(function(row) { row.delete(); });
  refreshUI();
});

document.getElementById("btn-dup-selected").addEventListener("click", function() {
  var selected = table.getSelectedRows();
  if (selected.length === 0) return;
  for (var i = 0; i < selected.length; i++) {
    var data = Object.assign({}, selected[i].getData());
    data.Sample_ID = data.Sample_ID ? data.Sample_ID + "_copy" : "";
    delete data.id;
    table.addRow(data, false, selected[i]);
  }
  table.deselectRow();
  refreshUI();
});

// ===========================================================================
// Keyboard shortcuts
// ===========================================================================

document.addEventListener("keydown", function(e) {
  // Ctrl+Z: undo
  if (e.ctrlKey && e.key === "z" && !e.shiftKey) {
    table.undo();
    refreshUI();
  }
  // Ctrl+Shift+Z or Ctrl+Y: redo
  if ((e.ctrlKey && e.shiftKey && e.key === "Z") || (e.ctrlKey && e.key === "y")) {
    table.redo();
    refreshUI();
  }
});
