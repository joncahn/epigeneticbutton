# profiles/default/config.yaml
#
# EPICC workflow profile. Carries the workflow-specific resource tuning
# (per-rule mem/runtime/threads via set-resources and set-threads). Intended
# to be used in combination with a cluster profile that supplies executor
# and site-specific settings (account, partition, qos, etc.).
#
# The `epicc` CLI passes --workflow-profile profiles/default automatically.
# To use a different tuning, pass --workflow-profile path/to/your/dir.
#
# Cluster profiles' set-resources/set-threads override values defined here,
# so site-specific tuning on top of this baseline is additive.

# ------------------------------------------------------------------------
# Resource tiers
# ------------------------------------------------------------------------

low_resources: &low
  mem_mb: 1000
  runtime: "1h"

standard_resources: &standard
  mem_mb: 2000
  runtime: "2h"

download_resources: &download
  mem_mb: 16000
  runtime: "12h"

heavy_resources: &heavy
  mem_mb: 16000
  runtime: "8h"

heavier_resources: &heavier
  mem_mb: 32000
  runtime: "8h"

max_resources: &max
  mem_mb: 32000
  runtime: "2d"

# DMRcaller pools per-replicate CX_reports into GRanges in memory and
# parallelizes per-context. Plant-genome runs with multiple replicates
# routinely overshoot the 32G *max budget once MulticoreParam is
# registered (each worker holds a slice). Doubled to 64G; bump further
# in a site profile if needed (large mammalian runs may need >100G).
dmr_resources: &dmr
  mem_mb: 64000
  runtime: "2d"

single_thread: &single
  mem_mb: 32000
  runtime: "8h"

# ------------------------------------------------------------------------
# Per-rule resource bindings
# ------------------------------------------------------------------------

set-resources:
  # environment_setup
  check_fasta: *standard
  check_gff: *standard
  check_gtf: *standard
  check_chrom_sizes: *single
  compute_genome_stats: *single
  resolve_taxid: *single
  prep_region_file: *low
  download_rfam: *standard
  build_structural_rna_db: *max
  check_te_file: *standard
  # sample_download
  get_fastq_pe: *download
  get_fastq_se: *download
  run_fastqc: *single
  process_fastq_pe: *heavy
  process_fastq_se: *heavy
  get_available_bam: *standard
  # ChIPseq
  make_bt2_indices: *heavy
  make_chromap_index: *heavy
  filter_bam_pe: *heavier
  filter_bam_se: *heavier
  make_mapping_stats_pe: *low
  make_mapping_stats_se: *low
  dispatch_final_bam: *standard
  make_coverage_chip: *heavy
  make_bigwig_chip: *heavy
  make_fingerprint_plot: *heavy
  calling_peaks_pe: *heavy
  calling_peaks_se: *heavy
  idr_analysis_replicates: *single
  merging_bam_replicates: *heavy
  making_pseudo_replicates: *heavy
  best_peaks_pseudoreps: *low
  find_motifs_in_file: *heavy
  make_peak_stats: *low
  perform_pairwise_diff_peaks: *heavy
  # ATACseq
  atac_shift_bam: *standard
  atac_bam_to_bed: *low
  calling_peaks_atac: *heavy
  make_coverage_atac: *heavier
  # mC
  make_bismark_indices: *heavy
  bismark_map_pe: *max
  bismark_map_se: *max
  make_mc_stats_pe: *low
  make_mc_stats_se: *low
  merging_mc_replicates: *heavy
  make_mc_bigwig_files: *single
  cache_mc_replicate_for_context: *heavy
  calibrate_dmr_min_diff: *heavy
  call_DMRs_for_pair_context: *dmr
  call_DMRs_pairwise: *dmr  # legacy rule, active only when custom_script_dmrs: true
  # dmC
  get_dmc_input: *standard
  copy_bedmethyl_input: *low
  prepare_modbam_for_pileup: *max
  make_mc_stats_dmc: *heavy
  modkit_summary_dmc: *heavy
  modkit_pileup_dmc: *heavier
  convert_bedmethyl_to_cx_report: *standard
  # RNAseq
  make_STAR_indices: *heavy
  STAR_map_pe: *heavier
  STAR_map_se: *heavier
  filter_rna_pe: *heavy
  filter_rna_se: *heavy
  make_rna_stats_pe: *low
  make_rna_stats_se: *low
  merging_rna_replicates: *heavy
  make_rna_stranded_bigwigs: *heavy
  make_rna_unstranded_bigwigs: *heavy
  prep_files_for_DEGs: *single
  call_all_DEGs: *single
  call_all_differential_srna_clusters: *single
  gather_gene_expression_rpkm: *single
  plot_expression_levels: *single
  create_GO_database: *single
  perform_GO_on_target_file: *single
  call_rampage_TSS: *heavy
  # smallRNA
  deduplicate_srna_nextflexv3: *standard
  make_bt2_indices_for_structural_RNAs: *heavy
  filter_structural_rna: *heavy
  make_bowtie1_indices: *single
  make_bowtie1_indices_large: *single
  shortstack_map: *heavier
  make_cluster_bedfiles: *low
  make_srna_size_stats: *standard
  filter_size_srna_sample: *standard
  merging_srna_replicates: *standard
  make_srna_stranded_bigwigs: *standard
  analyze_all_srna_samples_on_target_file: *heavy
  prep_files_for_differential_srna_clusters: *single
  # combined_analysis
  prepping_mapping_stats: *low
  plotting_mapping_stats: *low
  prepping_peak_stats: *low
  plotting_peak_stats: *low
  prepping_srna_sizes_stats: *low
  plotting_srna_sizes_stats: *low
  combine_peakfiles: *low
  combine_clusterfiles: *low
  combine_TSS: *low
  get_annotations_for_bedfile: *low
  plotting_upset_regions: *low
  making_stranded_matrix_on_targetfile: *heavy
  merging_matrix: *single
  computing_matrix_scales: *single
  sort_heatmap: *single
  plotting_heatmap_on_targetfile: *single
  plotting_sorted_heatmap_on_targetfile: *single
  plotting_profile_on_targetfile: *single
  prep_chromosomes_for_browser: *low
  prep_browser_on_region: *heavy
  make_single_loci_browser_plot: *single
  merge_region_browser_plots: *low
