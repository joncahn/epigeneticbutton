name: epibutton_chip
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - bowtie2
  - chromap
  - samtools
  - bedtools
  - deeptools
  - macs2
  - seacr
  - epic2
  - setuptools  # epic2 imports pkg_resources, which lives in setuptools and is no longer auto-installed on Python >=3.12
  - pigz
  - manorm