# Test configuration for mC (all methylation assay types) integration tests
# This config is designed for dry-run testing only and does not require actual files
# Covers: WGBS, WGBS_nd, PBAT, EMseq, dmC (modBAM + bedMethyl)

analysis_name: "test_mC"
sample_file: "tests/integration/data/test_samples_mC.tsv"

# Output directories
output_dir: "results_test_mC"
genome_dir: "genomes_test_mC"

# Minimal reference genome configuration for test_genome
genomes:
  test_genome:
    species: "test_species"
    fasta_file: "tests/integration/data/mock_inputs/test_genome.fa"
    gff_file: "tests/integration/data/mock_inputs/test_genome.gff3"
    gtf_file: "tests/integration/data/mock_inputs/test_genome.gtf"
    structural_rna_fafile: "data/zm_structural_RNAs.fa.gz"

# Analysis options
full_analysis: true
te_analysis: false
QC_option: "none"
GO: false
trimmed_fastqs: false
aligned_bams: false

# Methylation contexts (subset of CG, CHG, CHH)
methylation_contexts: ["CG", "CHG", "CHH"]

# dmC (direct methylation) parameters
dmc_methylation:
  alignment:
    preset: "lr:hqae"
  pileup:
    combine_mods: true
    min_coverage: 3

# DMR calling method for dmC samples: "dmrcaller" (default) or "modkit"
dmc_dmr_method: "dmrcaller"

# Trimming parameters (fastp)
quality_threshold:
  mC: 10

min_read_length:
  mC: 20

trim_front:
  mC: 0

adapter1:
  mC: "auto"

adapter2:
  mC: "auto"

# Bismark mapping parameters — all mC assay types
mC_mapping:
  default:
    map_pe: "--maxins 1000"
    map_se: ""
    process_pe: "--ignore_r2 2 --buffer_size 16G"
    process_se: "--buffer_size 16G"
  WGBS:
    map_pe: "--maxins 1000"
    map_se: ""
    process_pe: "--ignore_r2 2 --buffer_size 16G"
    process_se: "--buffer_size 16G"
  WGBS_nd:
    map_pe: "--maxins 1000 --non_directional"
    map_se: "--non_directional"
    process_pe: "--buffer_size 16G"
    process_se: "--buffer_size 16G"
  PBAT:
    map_pe: "--maxins 1000 --pbat"
    map_se: "--pbat"
    process_pe: "--buffer_size 16G"
    process_se: "--buffer_size 16G"
  EMseq:
    map_pe: "--maxins 1000"
    map_se: ""
    process_pe: "--buffer_size 16G"
    process_se: "--buffer_size 16G"
  dmC:
    map_pe: ""
    map_se: ""
    process_pe: ""
    process_se: ""

# Resource allocation (minimal for dry-run)
low_resources: &low
  threads: 1
  mem_mb: 1000
  tmp_mb: 1000
  qos: "default"

standard_resources: &standard
  threads: 2
  mem_mb: 2000
  tmp_mb: 2000
  qos: "default"

heavy_resources: &heavy
  threads: 4
  mem_mb: 8000
  tmp_mb: 16000
  qos: "default"

max_resources: &max
  threads: 8
  mem_mb: 16000
  tmp_mb: 32000
  qos: "default"

resources:
  # Environment setup
  check_fasta: *standard
  check_gff: *standard
  check_gtf: *standard
  check_chrom_sizes: *low
  compute_genome_stats: *low
  prep_region_file: *low

  # dmC methylation rules
  make_modkit_context_beds: *heavy
  get_modbam: *standard
  get_bedmethyl: *low
  align_modbam: *max
  modkit_summary: *heavy
  modkit_pileup: *heavy
  split_bedmethyl_by_context: *heavy
  make_dmc_bigwig_files: *low
  call_DMRs_modkit: *max

  # Bismark rules
  make_bismark_indices: *heavy
  bismark_map_pe: *heavy
  bismark_map_se: *heavy
  make_mc_stats_pe: *low
  make_mc_stats_se: *low
  merging_mc_replicates: *heavy
  make_mc_bigwig_files: *low
  call_DMRs_pairwise: *max
