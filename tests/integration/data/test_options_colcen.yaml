# Test configuration for A. thaliana ColCEN integration test
# Tests ChIP-seq (CenH3, H3K9me2), ATAC-seq, EMseq, and direct methylation (dmC)
# Shimada et al. 2024 Nat Plants (GSE132005), Crisp et al. 2020 (ATAC, GSE155023),
# Trasser et al. 2024 EMBO Reports (PRJNA1111825, EMseq)

analysis_name: "test_colcen"
sample_file: "tests/integration/data/test_samples_colcen.tsv"

# Output directories
output_dir: "results_test_colcen"
genome_dir: "genomes_test_colcen"

# Analysis options
full_analysis: true
te_analysis: true
QC_option: "none"
GO: false
trimmed_fastqs: false
aligned_bams: false
structural_rna_depletion: false
browser_TE_file: false

# Reference genome — downloaded from GitHub (Col-CEN v1.2)
genomes:
  ColCEN:
    genus: "Arabidopsis"
    species: "thaliana"
    fasta_file: "https://github.com/schatzlab/Col-CEN/raw/main/v1.2/Col-CEN_v1.2.fasta.gz"
    gff_file: "https://github.com/schatzlab/Col-CEN/raw/main/v1.2/Col-CEN_v1.2_genes.tair10.gff3.gz"
    te_file: "https://github.com/schatzlab/Col-CEN/raw/main/v1.2/t2t-col.20201227.fasta.mod.EDTA.TEanno.gff3.gz"
    gaf_file: "data/ColCEN_infoGO.tab.gz"
    gene_info_file: "data/ColCEN_genes_info.tab.gz"
    ncbi_taxid: "3702"

# Methylation context
mC_context: "all"

# Direct methylation (dmC) parameters
dmc_methylation:
  alignment:
    preset: "lr:hqae"
  pileup:
    combine_mods: true
    min_coverage: 3

# DMR calling
custom_script_dmrs: false
dmc_dmr_method: "dmrcaller"

# Trimming parameters (fastp)
quality_threshold:
  ChIP: 10
  mC: 10
  ATAC: 10

min_read_length:
  ChIP: 20
  mC: 20
  ATAC: 20

trim_front:
  ChIP: 0
  mC: 0
  ATAC: 0

adapter1:
  ChIP: "auto"
  mC: "auto"
  ATAC: "TCGTCGGCAGCGTCAGATGTGTATAAGAGACAG"

adapter2:
  ChIP: "auto"
  mC: "auto"
  ATAC: "GTCTCGTGGGCTCGGAGATGTGTATAAGAGACAG"

# Aligner
chip_aligner: "chromap"
atac_aligner: "chromap"
chip_mapping_strategy: "default"
atac_mapping_strategy: "default"

# Bismark mapping parameters (for non-dmC mC samples, not used here but required)
mC_mapping:
  default:
    map_pe: "--maxins 1000"
    map_se: ""
    process_pe: "--ignore_r2 2 --buffer_size 16G"
    process_se: "--buffer_size 16G"
  EMseq:
    map_pe: "--maxins 1000"
    map_se: ""
    process_pe: "--buffer_size 16G"
    process_se: "--buffer_size 16G"
  PBAT:
    map_pe: "--maxins 1000 --pbat"
    map_se: "--pbat"
    process_pe: "--buffer_size 16G"
    process_se: "--buffer_size 16G"
  dmC:
    map_pe: ""
    map_se: ""
    process_pe: ""
    process_se: ""

# Resource allocation (test-scale)
low_resources: &low
  threads: 1
  mem_mb: 1000
  tmp_mb: 1000
  runtime: 60
  qos: "cpu_snice"

standard_resources: &standard
  threads: 2
  mem_mb: 2000
  tmp_mb: 2000
  runtime: 120
  qos: "cpu_snice"

download_resources: &download
  threads: 4
  mem_mb: 4000
  tmp_mb: 16000
  runtime: 720
  qos: "cpu_snice"

heavy_resources: &heavy
  threads: 4
  mem_mb: 8000
  tmp_mb: 16000
  runtime: 480
  qos: "cpu_snice"

heavier_resources: &heavier
  threads: 8
  mem_mb: 16000
  tmp_mb: 32000
  runtime: 480
  qos: "cpu_snice"

max_resources: &max
  threads: 8
  mem_mb: 16000
  tmp_mb: 32000
  runtime: 2880
  qos: "cpu_snice"

single_thread: &single
  threads: 1
  mem_mb: 8000
  tmp_mb: 16000
  runtime: 480
  qos: "cpu_snice"

resources:
  # Environment setup
  check_fasta: *download
  check_gff: *download
  check_gtf: *standard
  check_chrom_sizes: *low
  compute_genome_stats: *low
  resolve_taxid: *single
  prep_region_file: *low
  check_te_file: *download
  # Sample download
  get_fastq_pe: *download
  get_fastq_se: *download
  run_fastqc: *single
  process_fastq_pe: *heavy
  process_fastq_se: *heavy
  get_available_bam: *standard
  # ChIPseq
  make_bt2_indices: *heavy
  make_chromap_index: *heavy
  filter_bam_pe: *heavier
  filter_bam_se: *heavier
  make_mapping_stats_pe: *low
  make_mapping_stats_se: *low
  dispatch_final_bam: *standard
  make_coverage_chip: *heavy
  make_bigwig_chip: *heavy
  make_fingerprint_plot: *heavy
  calling_peaks_macs2_pe: *heavy
  calling_peaks_macs2_se: *heavy
  idr_analysis_replicates: *single
  merging_bam_replicates: *heavy
  making_pseudo_replicates: *heavy
  best_peaks_pseudoreps: *low
  find_motifs_in_file: *heavy
  make_peak_stats: *low
  perform_pairwise_diff_peaks: *heavy
  # ATACseq
  atac_shift_bam: *standard
  atac_bam_to_bed: *low
  calling_peaks_atac: *heavy
  make_coverage_atac: *heavier
  # mC / dmC
  make_bismark_indices: *heavy
  bismark_map_pe: *max
  bismark_map_se: *max
  make_mc_stats_pe: *low
  make_mc_stats_se: *low
  merging_mc_replicates: *heavy
  make_mc_bigwig_files: *single
  call_DMRs_pairwise: *max
  make_modkit_context_beds: *heavy
  get_modbam: *download
  get_bedmethyl: *low
  align_modbam: *max
  modkit_summary: *heavy
  modkit_pileup: *heavy
  split_bedmethyl_by_context: *heavy
  make_dmc_bigwig_files: *single
  call_DMRs_modkit: *max
  convert_bedmethyl_to_cx_report: *standard
  # Combined analysis
  prepping_mapping_stats: *low
  plotting_mapping_stats: *low
  prepping_peak_stats: *low
  plotting_peak_stats: *low
  combine_peakfiles: *low
  get_annotations_for_bedfile: *low
  plotting_upset_regions: *low
  making_stranded_matrix_on_targetfile: *heavy
  merging_matrix: *single
  computing_matrix_scales: *single
  sort_heatmap: *single
  plotting_heatmap_on_targetfile: *single
  plotting_sorted_heatmap_on_targetfile: *single
  plotting_profile_on_targetfile: *single
  prep_chromosomes_for_browser: *low
  prep_browser_on_region: *heavy
  make_single_loci_browser_plot: *single
  merge_region_browser_plots: *low
  summarize_tracks_pca: *max
  plot_PCA_correlation: *single
