# Test configuration for ATAC-seq integration tests
# This config is designed for dry-run testing only and does not require actual files

analysis_name: "test_ATAC"
sample_file: "tests/integration/data/test_samples_ATAC.tsv"

# Output directories
output_dir: "results_test_ATAC"
genome_dir: "genomes_test_ATAC"

# Minimal reference genome configuration for test_genome
genomes:
  test_genome:
    species: "test_species"
    fasta_file: "tests/integration/data/mock_inputs/test_genome.fa"
    gff_file: "tests/integration/data/mock_inputs/test_genome.gff3"
    gtf_file: "tests/integration/data/mock_inputs/test_genome.gtf"
    structural_rna_fafile: "data/zm_structural_RNAs.fa.gz"

# Analysis options
full_analysis: true
te_analysis: false
QC_option: "none"
GO: false
trimmed_fastqs: false
aligned_bams: false

# Aligner and mapping strategy for ATAC
atac_aligner: "chromap"
atac_mapping_strategy: "default"

# Trimming parameters (fastp)
quality_threshold:
  ATAC: 10

min_read_length:
  ATAC: 20

trim_front:
  ATAC: 0

adapter1:
  ATAC: "TCGTCGGCAGCGTCAGATGTGTATAAGAGACAG"

adapter2:
  ATAC: "GTCTCGTGGGCTCGGAGATGTGTATAAGAGACAG"

# Bowtie2-based mapping parameters (shared by ChIP and ATAC)
bt2_mapping_strategy:
  default:
    map_pe: "--end-to-end --maxins 1500"
    map_se: "--end-to-end"
    filter: "-b -h -q 10 -F 256"
  repeat:
    map_pe: "--very-sensitive --no-mixed --no-discordant --k 100 --end-to-end"
    map_se: "--very-sensitive --k 100 --end-to-end"
    filter: "-b -h -q 10 -F 256"
  repeatall:
    map_pe: "--very-sensitive --no-mixed --no-discordant --k 100 --end-to-end"
    map_se: "--very-sensitive --k 100 --end-to-end"
    filter: "-b -h -F 256"
  all:
    map_pe: "--end-to-end --maxins 1500"
    map_se: "--end-to-end"
    filter: "-b -h -F 256"

# For ATAC bigwigs
atac_tracks:
  binsize: 1
  params: "--normalizeUsing CPM"

# For ATAC peaks
atac_callpeaks:
  peaktype: "narrow"
  params: "--keep-dup all --nomodel --shift 75 --extsize 150"

# ChIP peak calling config (needed because ATAC reuses some ChIP rules for pseudo-rep peaks)
chip_callpeaks:
  peaktype:
    'H3K4me1|H3K27me1|H3K27me2|H3K27me3|H3K9me1|H3K9me2|H3K9me3|H4K20me1|H4K20me2|H4K20me3': "broad"
    'H3K27ac|H3K4me3|H3K9ac|H4K16ac|H3K23ac|MNase': "narrow"
    'H3|H4': "broad"
  params: "--keep-dup all --nomodel"

# Differential peaks (MAnorm)
diffpeaks_params:
  ATAC_pe: "-w 1000 --s1 75 --s2 75"
  ATAC_se: "-w 1000 --s1 75 --s2 75"

# Upset plot option
upset_allreps: false

# Resource allocation (minimal for dry-run)
low_resources: &low
  threads: 1
  mem_mb: 1000
  tmp_mb: 1000
  qos: "default"

standard_resources: &standard
  threads: 2
  mem_mb: 2000
  tmp_mb: 2000
  qos: "default"

heavy_resources: &heavy
  threads: 4
  mem_mb: 8000
  tmp_mb: 16000
  qos: "default"

max_resources: &max
  threads: 8
  mem_mb: 16000
  tmp_mb: 32000
  qos: "default"

resources:
  # Environment setup
  check_fasta: *standard
  check_gff: *standard
  check_gtf: *standard
  check_chrom_sizes: *low
  compute_genome_stats: *low
  prep_region_file: *low
  resolve_taxid: *low

  # Sample download / FASTQ processing
  get_fastq_pe: *standard
  get_fastq_se: *standard
  run_fastqc: *low
  process_fastq_pe: *heavy
  process_fastq_se: *heavy
  get_available_bam: *standard

  # ChIP/ATAC shared mapping rules
  make_bt2_indices: *heavy
  make_chromap_index: *heavy
  filter_bam_pe: *heavy
  filter_bam_se: *heavy
  make_mapping_stats_pe: *low
  make_mapping_stats_se: *low
  dispatch_final_bam: *standard

  # ATAC-specific rules
  atac_shift_bam: *standard
  atac_bam_to_bed: *low
  calling_peaks_atac: *heavy
  make_coverage_atac: *heavy

  # ChIP/ATAC shared replicate and peak analysis rules
  merging_bam_replicates: *heavy
  making_pseudo_replicates: *heavy
  best_peaks_pseudoreps: *low
  idr_analysis_replicates: *low
  make_peak_stats: *low
  perform_pairwise_diff_peaks: *heavy

  # Combined analysis rules
  prepping_mapping_stats: *low
  plotting_mapping_stats: *low
  prepping_peak_stats: *low
  plotting_peak_stats: *low
  combine_peakfiles: *low
  get_annotations_for_bedfile: *low
  plotting_upset_regions: *low
